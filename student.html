<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thi trắc nghiệm - TC Kinh tế Kỹ thuật TP Cần Thơ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <style>
    :root {
      --color-iris-bolt: #4255ff;
      --color-ink-charcoal: #282e3e;
      --color-deep-indigo: #2e3856;
      --color-slate-veil: #586380;
      --color-fog-mist: #939bb4;
      --color-chalk-canvas: #f6f7fb;
      --color-paper-white: #ffffff;
      --color-lilac-wash: #edefff;
      --color-mist-border: #d9dde8;
    }

    * {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }

    /* Mobile: ngăn zoom khi tap input trên iOS */
    input, select, textarea, button { -webkit-appearance: none; }
    html { -webkit-overflow-scrolling: touch; }

    /* Safe area cho iPhone notch */
    body {
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      background-color: var(--color-chalk-canvas);
      min-height: 100vh;
      margin: 0;
    }

    /* ===== HEADER ===== */
    header {
      background: var(--color-deep-indigo);
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-inner {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-brand {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-paper-white);
      text-decoration: none;
      letter-spacing: -0.3px;
    }

    .header-brand span { color: #93a8ff; }

    .header-student-info {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
    }

    /* ===== LOADING ===== */
    .spinner {
      border: 3px solid var(--color-mist-border);
      border-top: 3px solid var(--color-iris-bolt);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== CARDS CHUNG ===== */
    .glass-card {
      background: var(--color-paper-white);
      border: 1px solid var(--color-mist-border);
      border-radius: 20px;
    }

    /* ===== TIMER ===== */
    .timer-normal {
      color: var(--color-ink-charcoal);
      background: var(--color-chalk-canvas);
    }
    .timer-warning {
      color: #b45309;
      background: #fffbeb;
      animation: pulse-slow 1.5s ease-in-out infinite;
    }
    .timer-danger {
      color: #b91c1c;
      background: #fff5f5;
      animation: pulse-fast 0.8s ease-in-out infinite;
    }

    @keyframes pulse-slow { 0%,100%{opacity:1} 50%{opacity:0.7} }
    @keyframes pulse-fast { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.85;transform:scale(1.04)} }

    /* ===== PROGRESS BAR ===== */
    .progress-bar {
      background: var(--color-iris-bolt);
      transition: width 0.4s ease;
      border-radius: 999px;
    }

    /* ===== TEST HEADER (sticky trong bài thi) ===== */
    .test-header {
      background: var(--color-paper-white);
      border-bottom: 1px solid var(--color-mist-border);
      position: sticky;
      top: 60px;
      z-index: 30;
    }

    /* ===== QUESTION CARD ===== */
    .question-card {
      background: var(--color-paper-white);
      border: 1px solid var(--color-mist-border);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .question-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--color-iris-bolt);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .question-card.answered {
      border-color: var(--color-iris-bolt);
    }

    .question-card.answered::before {
      opacity: 1;
    }

    .question-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      background: var(--color-deep-indigo);
      color: white;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }

    /* ===== OPTIONS ===== */
    .option-label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border: 2px solid var(--color-mist-border);
      border-radius: 12px;
      background: var(--color-paper-white);
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s;
      min-height: 48px;
      font-size: 15px;
    }

    .option-label:hover {
      border-color: var(--color-iris-bolt);
      background: var(--color-lilac-wash);
    }

    .option-label.selected {
      border-color: var(--color-iris-bolt);
      background: var(--color-lilac-wash);
    }

    .option-checkbox,
    .option-radio {
      width: 22px;
      height: 22px;
      border: 2px solid var(--color-mist-border);
      flex-shrink: 0;
      transition: all 0.18s;
      background: var(--color-paper-white);
    }

    .option-checkbox { border-radius: 6px; }
    .option-radio { border-radius: 50%; }

    input[type="checkbox"]:checked ~ .option-checkbox,
    input[type="radio"]:checked ~ .option-radio {
      background: var(--color-iris-bolt);
      border-color: var(--color-iris-bolt);
    }

    input[type="checkbox"]:checked ~ .option-checkbox::after {
      content: '✓';
      display: block;
      color: white;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      line-height: 18px;
    }

    input[type="radio"]:checked ~ .option-radio::after {
      content: '';
      display: block;
      width: 10px;
      height: 10px;
      background: white;
      border-radius: 50%;
      margin: 4px auto;
    }

    /* ===== SUBMIT BUTTON ===== */
    .btn-submit {
      background: #16a34a;
      color: white;
      font-weight: 600;
      font-size: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.18s, transform 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: #15803d;
      transform: translateY(-1px);
    }

    .btn-submit:active { transform: translateY(0); }

    /* ===== QUESTION NAV ===== */
    .question-nav {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
      gap: 8px;
    }

    .question-nav-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 2px solid var(--color-mist-border);
      background: var(--color-paper-white);
      font-size: 13px;
      font-weight: 600;
      color: var(--color-slate-veil);
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s, transform 0.15s;
    }

    .question-nav-btn:hover {
      border-color: var(--color-iris-bolt);
      transform: scale(1.05);
    }

    .question-nav-btn.answered {
      background: var(--color-iris-bolt);
      color: white;
      border-color: var(--color-iris-bolt);
    }

    .question-nav-btn.flagged {
      background: #fffbeb;
      border-color: #d97706;
      color: #92400e;
    }

    .question-nav-btn.answered.flagged {
      background: var(--color-iris-bolt);
      border: 2px solid #d97706;
      box-shadow: 0 0 0 2px #fef3c7;
      color: white;
    }

    .question-nav-btn.current {
      border-color: var(--color-iris-bolt);
      box-shadow: 0 0 0 3px rgba(66,85,255,0.15);
    }

    /* ===== RESULT CARD ===== */
    .result-card {
      background: var(--color-deep-indigo);
      border-radius: 20px;
      color: white;
      position: relative;
      overflow: hidden;
    }

    /* ===== ANSWER REVIEW ===== */
    .answer-correct {
      border-left: 3px solid #16a34a;
      background: #f0fdf4;
    }

    .answer-wrong {
      border-left: 3px solid #dc2626;
      background: #fff5f5;
    }

    .option-correct {
      background: #dcfce7;
      border-color: #16a34a;
    }

    .option-wrong {
      background: #fee2e2;
      border-color: #dc2626;
    }

    .option-missed {
      background: #f0fdf4;
      border-color: #86efac;
    }

    /* ===== FADE IN ===== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fade-in { animation: fadeInUp 0.4s ease-out; }

    /* ===== MOBILE ===== */
    @media (max-width: 640px) {
      .option-label {
        padding: 13px 14px;
        font-size: 15px;
      }
      .question-card { border-radius: 12px; }
      .test-header { top: 60px; }
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- Header -->
  <header>
    <div class="header-inner">
      <a href="index.html" class="header-brand">Da<span>Quiz</span></a>
      <div id="studentInfo" class="header-student-info" style="display:none"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main style="max-width:900px;margin:0 auto;padding:24px 16px 80px;" id="mainContent">

    <!-- Loading State -->
    <div id="loading" style="display:flex;align-items:center;justify-content:center;padding:80px 0;">
      <div style="text-align:center;">
        <div class="spinner" style="margin-bottom:16px;"></div>
        <p style="color:var(--color-slate-veil);font-size:15px;font-weight:500;">Đang tải bài kiểm tra...</p>
      </div>
    </div>

    <!-- Error Message -->
    <div id="errorMsg" class="glass-card" style="display:none;padding:40px;text-align:center;">
      <div style="font-size:48px;margin-bottom:16px;">⚠️</div>
      <p style="color:#dc2626;font-weight:600;font-size:16px;margin:0 0 16px;"></p>
      <a href="index.html" style="display:inline-flex;align-items:center;gap:8px;background:var(--color-deep-indigo);color:white;padding:12px 24px;border-radius:12px;font-weight:600;text-decoration:none;font-size:14px;">
        ← Về trang chủ
      </a>
    </div>

  </main>

  <script>
    let testCode = null, testData = null, studentName = null;
    let currentScreen = 'name', submissionId = null, submissionData = null;
    let questionMapping = null, timerInterval = null, autoSaveInterval = null;
    let flaggedQuestions = new Set();

    // ========================
    //  HÀM GOM ĐÁP ÁN CHUNG
    // ========================
    function collectAnswers() {
      const answers = [];
      questionMapping.questionOrder.forEach(qo => {
        let selectedOptions = [];
        const checkboxes = document.querySelectorAll(`input[name^="answer_${qo.questionId}_"]:checked`);
        if (checkboxes.length > 0) {
          checkboxes.forEach(inp => selectedOptions.push(parseInt(inp.value)));
        } else {
          const radio = document.querySelector(`input[name="answer_${qo.questionId}"]:checked`);
          if (radio) selectedOptions = [parseInt(radio.value)];
        }
        answers.push({ questionId: qo.questionId, selectedOptions });
      });
      return answers;
    }

    // Đếm số câu đã trả lời
    function countAnswered() {
      let count = 0;
      questionMapping.questionOrder.forEach(qo => {
        const checkboxes = document.querySelectorAll(`input[name^="answer_${qo.questionId}_"]:checked`);
        const radio = document.querySelector(`input[name="answer_${qo.questionId}"]:checked`);
        if (checkboxes.length > 0 || radio) count++;
      });
      return count;
    }

    // Cập nhật thanh tiến trình
    function updateProgress() {
      const total = questionMapping ? questionMapping.questionOrder.length : 0;
      if (total === 0) return;
      const answered = countAnswered();
      const pct = Math.round((answered / total) * 100);
      const bar = document.getElementById('progressBar');
      const text = document.getElementById('progressText');
      if (bar) bar.style.width = pct + '%';
      if (text) text.textContent = `${answered}/${total}`;

      // Update question cards visual state
      questionMapping.questionOrder.forEach((qo, idx) => {
        const card = document.getElementById(`q-card-${idx}`);
        const navBtn = document.getElementById(`nav-${idx}`);
        if (!card) return;

        const checkboxes = document.querySelectorAll(`input[name^="answer_${qo.questionId}_"]:checked`);
        const radio = document.querySelector(`input[name="answer_${qo.questionId}"]:checked`);
        const isAnswered = checkboxes.length > 0 || radio;

        if (isAnswered) {
          card.classList.add('answered');
          if (navBtn) navBtn.classList.add('answered');
        } else {
          card.classList.remove('answered');
          if (navBtn) navBtn.classList.remove('answered');
        }
      });
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      testCode = params.get('code');
      if (!testCode) {
        showCodeInput();
        return;
      }

      // Khi học sinh đóng/reload trang giữa chừng → đánh dấu "đã thoát" để xử lý khi vào lại
      window.addEventListener('beforeunload', () => {
        if (currentScreen !== 'taking' || !submissionId) return;
        // Lưu vào sessionStorage: sẽ được đọc khi học sinh vào lại cùng trình duyệt
        sessionStorage.setItem('exitedSubmission', JSON.stringify({
          submissionId,
          exitViolations: tabSwitchCount + 1 // +1 cho lần thoát này
        }));
      });

      await askName();
    }

    function showCodeInput() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('mainContent').innerHTML = `
        <div class="glass-card fade-in" style="max-width:440px;margin:48px auto;padding:40px;text-align:center;">
          <div style="font-size:48px;margin-bottom:16px;">🔑</div>
          <h2 style="font-size:22px;font-weight:700;color:var(--color-ink-charcoal);margin:0 0 8px;">Nhập mã bài kiểm tra</h2>
          <p style="color:var(--color-slate-veil);font-size:14px;margin:0 0 24px;">Mã 4–6 ký tự từ giáo viên</p>
          <input type="text" id="codeInput" placeholder="VD: ABC123"
            style="width:100%;height:52px;border:2px solid var(--color-mist-border);border-radius:12px;padding:0 18px;font-size:20px;font-weight:700;letter-spacing:4px;text-align:center;text-transform:uppercase;color:var(--color-ink-charcoal);outline:none;margin-bottom:12px;"
            maxlength="6" autofocus
            onfocus="this.style.borderColor='var(--color-iris-bolt)'"
            onblur="this.style.borderColor='var(--color-mist-border)'">
          <button onclick="goWithCode()"
            style="width:100%;height:52px;background:var(--color-iris-bolt);color:white;font-size:15px;font-weight:600;border:none;border-radius:12px;cursor:pointer;">
            Vào thi
          </button>
        </div>`;
    }

    function goWithCode() {
      const c = document.getElementById('codeInput').value.trim().toUpperCase();
      if (!c || c.length < 4) return alert('Vui lòng nhập mã bài kiểm tra');
      window.location.href = `student.html?code=${encodeURIComponent(c)}`;
    }

    async function askName() {
      document.getElementById('loading').style.display = 'none';
      const main = document.getElementById('mainContent');

      const { data: test, error } = await supabase.from('tests').select('*').eq('test_code', testCode.toUpperCase()).single();
      if (error || !test) {
        showError('❌ Mã bài kiểm tra không tồn tại hoặc đã bị xóa.');
        return;
      }
      testData = test;

      const now = new Date();
      if (now < new Date(test.start_time)) {
        showError(`⏰ Bài kiểm tra chưa mở. Thời gian mở: ${new Date(test.start_time).toLocaleString('vi-VN')}`);
        return;
      }
      if (now > new Date(test.end_time)) {
        showError('⏰ Bài kiểm tra đã đóng.');
        return;
      }

      main.innerHTML = `
        <div class="glass-card fade-in" style="max-width:480px;margin:40px auto;padding:36px;">
          <div style="text-align:center;margin-bottom:24px;">
            <img
              src="student-code.svg"
              alt="Học sinh nhập mã bài kiểm tra"
              loading="lazy"
              width="200"
              style="display:block;margin:0 auto 16px;height:auto;"
            >
            <h2 style="font-size:20px;font-weight:700;color:var(--color-ink-charcoal);margin:0 0 6px;">${escapeHtml(test.title)}</h2>
            <div style="display:flex;align-items:center;justify-content:center;gap:16px;font-size:13px;color:var(--color-slate-veil);margin-bottom:10px;">
              <span>📋 ${test.questions?.length || 0} câu hỏi</span>
              <span>⏱ ${test.duration} phút</span>
            </div>
            <span style="display:inline-block;background:var(--color-lilac-wash);color:var(--color-iris-bolt);font-size:12px;font-weight:600;padding:4px 12px;border-radius:100px;">Mã: ${testCode.toUpperCase()}</span>
          </div>

          <div style="background:var(--color-chalk-canvas);border:1px solid var(--color-mist-border);border-radius:12px;padding:16px;margin-bottom:20px;">
            <p style="font-size:13px;font-weight:600;color:var(--color-ink-charcoal);margin:0 0 8px;">Lưu ý quan trọng:</p>
            <ul style="font-size:13px;color:var(--color-slate-veil);margin:0;padding-left:4px;list-style:none;display:flex;flex-direction:column;gap:4px;">
              <li>• Bạn có tối đa <strong>${test.max_attempts || 1} lần</strong> làm bài</li>
              <li>• Đáp án được tự động lưu khi chọn</li>
              <li>• Không tắt trình duyệt khi đang làm bài</li>
            </ul>
          </div>

          ${buildStrictModeNoticeHTML(test)}

          <div style="margin-bottom:16px;">
            <label style="display:block;font-size:13px;font-weight:600;color:var(--color-ink-charcoal);margin-bottom:8px;">Họ và tên</label>
            <input type="text" id="studentNameInput" placeholder="Nhập họ và tên của bạn"
              style="width:100%;height:48px;border:2px solid var(--color-mist-border);border-radius:12px;padding:0 16px;font-size:15px;color:var(--color-ink-charcoal);outline:none;box-sizing:border-box;"
              autofocus
              onfocus="this.style.borderColor='var(--color-iris-bolt)'"
              onblur="this.style.borderColor='var(--color-mist-border)'">
          </div>

          <button onclick="startTest()"
            style="width:100%;height:52px;background:var(--color-deep-indigo);color:white;font-size:15px;font-weight:600;border:none;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;">
            <span style="font-size:20px;">🚀</span>
            <span>Bắt đầu làm bài</span>
          </button>
        </div>`;
    }

    function showError(msg) {
      document.getElementById('loading').style.display = 'none';
      const err = document.getElementById('errorMsg');
      err.querySelector('p').textContent = msg;
      err.style.display = 'block';
    }

    async function startTest() {
      try {
        studentName = document.getElementById('studentNameInput')?.value.trim();
        if (!studentName) return alert('Vui lòng nhập họ và tên.');

        const { data: existingSubs, error: subError } = await supabase.from('submissions')
          .select('*').eq('test_id', testData.id).eq('student_name', studentName)
          .order('attempt_number', { ascending: false });

        if (subError) throw new Error('Lỗi kiểm tra lần làm: ' + subError.message);

        // Kiểm tra xem có submission đang in-progress không
        const inProgressSub = (existingSubs || []).find(s => s.status === 'in-progress');

        if (inProgressSub) {
          // Có bài đang làm dở - hỏi xem muốn tiếp tục hay làm lại
          const continueTest = confirm(`📝 Bạn có bài làm chưa hoàn thành (Lần ${inProgressSub.attempt_number}).\n\n✅ Nhấn OK để TIẾP TỤC bài làm cũ\n❌ Nhấn Cancel để LÀM LẠI từ đầu`);

          if (continueTest) {
            // Tiếp tục bài làm cũ
            submissionId = inProgressSub.id;
            submissionData = {
              started_at: inProgressSub.started_at,
              answers: inProgressSub.answers || [],
              status: 'in-progress'
            };

            // Load lại question mapping từ submission
            if (inProgressSub.question_order && inProgressSub.option_mappings) {
              questionMapping = {
                questionOrder: inProgressSub.question_order,
                optionMappings: inProgressSub.option_mappings
              };
            } else {
              questionMapping = buildQuestionMapping(testData);
              await supabase.from('submissions').update({
                question_order: questionMapping.questionOrder,
                option_mappings: questionMapping.optionMappings
              }).eq('id', submissionId);
            }

            // Khôi phục số vi phạm cũ từ DB
            tabSwitchCount = inProgressSub.tab_switch_count || 0;

            // Kiểm tra sessionStorage xem có lần thoát trang nào chưa được ghi không
            const exitedData = sessionStorage.getItem('exitedSubmission');
            if (exitedData) {
              try {
                const { submissionId: exitId, exitViolations } = JSON.parse(exitedData);
                if (exitId === submissionId && exitViolations > tabSwitchCount) {
                  tabSwitchCount = exitViolations;
                  // Ghi lên DB ngay
                  await supabase.from('submissions').update({ tab_switch_count: tabSwitchCount }).eq('id', submissionId);
                }
              } catch(e) {}
              sessionStorage.removeItem('exitedSubmission');
            }

            // Tính thời gian kết thúc dựa trên thời gian bắt đầu ban đầu
            const startedAt = new Date(inProgressSub.started_at);
            const endTime = new Date(startedAt.getTime() + testData.duration * 60000);

            // Lấy strict config để kiểm tra vi phạm
            const sm = getStrictConfig(testData);

            // Nếu đã vượt max_violations → tự nộp bài ngay, không cho làm tiếp
            if (sm.enabled && sm.block_tab_switch && tabSwitchCount >= sm.max_violations) {
              currentScreen = 'taking'; // cần set để submitTest chạy được
              submissionData.answers = inProgressSub.answers || [];
              // Render nhanh rồi nộp
              document.getElementById('mainContent').innerHTML = `
                <div class="text-center py-20">
                  <div class="text-6xl mb-4">🚫</div>
                  <p class="text-red-600 font-bold text-xl mb-2">Vi phạm quy định thi!</p>
                  <p class="text-gray-500">Bài thi đang được nộp tự động...</p>
                </div>`;
              await supabase.from('submissions').update({
                status: 'submitted',
                submitted_at: new Date().toISOString(),
                answers: inProgressSub.answers || [],
                tab_switch_count: tabSwitchCount
              }).eq('id', submissionId);
              const score = await gradeTest(testData, inProgressSub.answers || [], questionMapping);
              const totalPoints = (questionMapping.questionOrder||[]).reduce((sum, q) => sum + (q.points||1), 0);
              await supabase.from('submissions').update({ score, total_points: totalPoints }).eq('id', submissionId);
              await showResult(score, inProgressSub.answers || []);
              return;
            }

            currentScreen = 'taking';
            document.getElementById('studentInfo').innerHTML = `
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
              </svg>
              <span>${escapeHtml(studentName)}</span>
            `;
            document.getElementById('studentInfo').style.display = 'flex';
            await renderTestTaking(endTime);
            startAutoSave();
            activateAntiCheat();

            // Hiện cảnh báo nếu đã có vi phạm từ trước
            if (sm.enabled && sm.block_tab_switch && tabSwitchCount > 0) {
              const remaining = sm.max_violations - tabSwitchCount;
              const warn = document.createElement('div');
              warn.style.cssText = `
                position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
                z-index: 9999; background: linear-gradient(135deg, #dc2626, #b91c1c);
                color: white; padding: 16px 24px; border-radius: 16px;
                box-shadow: 0 16px 48px rgba(220,38,38,0.4);
                font-weight: 700; text-align: center; max-width: 380px; width: 90%;
              `;
              warn.innerHTML = `
                <div style="font-size:22px;margin-bottom:6px">⚠️ Bạn đã thoát khỏi bài thi!</div>
                <p style="font-size:13px;font-weight:600">Vi phạm hiện tại: ${tabSwitchCount}/${sm.max_violations}</p>
                <p style="font-size:12px;opacity:0.9;margin-top:4px">Còn ${remaining} lần trước khi bài thi bị nộp tự động</p>
              `;
              document.body.appendChild(warn);
              setTimeout(() => warn.remove(), 5000);
            }
            return;
          } else {
            // Xóa bài cũ và tạo bài mới
            await supabase.from('submissions').delete().eq('id', inProgressSub.id);
          }
        }

        // Kiểm tra số lần đã submit
        const submittedCount = (existingSubs || []).filter(s => s.status === 'submitted' || s.status === 'timed-out').length;
        if (submittedCount >= (testData.max_attempts || 1)) {
          return alert('❌ Bạn đã hết lượt làm bài này.');
        }

        // Tạo submission mới
        // Build mapping TRƯỚC để tính total_points chính xác
        questionMapping = buildQuestionMapping(testData);
        const totalPointsForSub = (questionMapping.questionOrder||[]).reduce((sum, q) => sum + (q.points||1), 0);

        const attemptNum = (existingSubs?.[0]?.attempt_number || 0) + 1;
        const now = new Date();
        const { data: newSub, error: insertError } = await supabase.from('submissions').insert({
          test_id: testData.id,
          student_name: studentName,
          attempt_number: attemptNum,
          status: 'in-progress',
          started_at: now.toISOString(),
          answers: [],
          total_points: totalPointsForSub
        }).select().single();

        if (insertError || !newSub) {
          throw new Error('Lỗi tạo phiên làm bài: ' + (insertError?.message || 'Không có dữ liệu trả về'));
        }

        submissionId = newSub.id;
        submissionData = { started_at: now.toISOString(), answers: [], status: 'in-progress' };
        const { error: updateError } = await supabase.from('submissions').update({
          question_order: questionMapping.questionOrder,
          option_mappings: questionMapping.optionMappings
        }).eq('id', submissionId);

        if (updateError) throw new Error('Lỗi cập nhật cấu hình: ' + updateError.message);

        const endTime = new Date(now.getTime() + testData.duration * 60000);
        currentScreen = 'taking';
        document.getElementById('studentInfo').innerHTML = `
          <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
          </svg>
          <span>${escapeHtml(studentName)}</span>
        `;
        document.getElementById('studentInfo').style.display = 'flex';
        await renderTestTaking(endTime);
        startAutoSave();
        activateAntiCheat();
      } catch (e) {
        alert('Lỗi: ' + e.message);
        await askName();
      }
    }

    function buildQuestionMapping(test) {
      const questions = [...(test.questions || [])];
      const questionOrder = [];
      if (test.shuffle_questions) questions.sort(() => Math.random() - 0.5);
      questions.forEach((q, i) => questionOrder.push({ qIndex: i, questionId: q.questionId || q.id, points: q.points || 1 }));
      return { questionOrder, optionMappings: {} };
    }

                  </svg>

              <div id="progressBar" class="progress-bar" style="height:100%;width:0%;"></div>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--color-fog-mist);">
              <span>Tiến độ trả lời</span>

            <span style="display:flex;align-items:center;gap:6px;"><span style="width:16px;height:16px;border-radius:5px;background:#fffbeb;border:2px solid #d97706;display:inline-block;"></span>Cần xem lại</span>
            <span style="display:flex;align-items:center;gap:6px;"><span style="width:16px;height:16px;border-radius:5px;background:white;border:2px solid var(--color-mist-border);display:inline-block;"></span>Chưa làm</span>

        <!-- Final Submit -->

          <button onclick="submitTest()" class="btn-submit" style="padding:0 40px;height:52px;font-size:16px;border-radius:14px;">
            <span style="font-size:20px;">📝</span>
            <span>Nộp bài kiểm tra</span>
          </button>

        </div>`;

      startTimer(endTime);
      updateProgress();

      // Thay placeholder icon cờ (tránh lỗi parser HTML với </svg> trong template literal)

      document.querySelectorAll('.flag-btn').forEach(btn => {
        if (btn.textContent.includes('__FLAG_ICON_OUTLINE__')) btn.innerHTML = svgO;
      });
    }

    function scrollToQuestion(index) {
      const card = document.getElementById(`q-card-${index}`);
      if (card) {
        const headerHeight = 180;
        const cardTop = card.getBoundingClientRect().top + window.pageYOffset - headerHeight;
        window.scrollTo({ top: cardTop, behavior: 'smooth' });

        // Highlight effect
        card.style.boxShadow = '0 0 0 4px rgba(102, 126, 234, 0.3)';
        setTimeout(() => {
          card.style.boxShadow = '';
        }, 1000);
      }
    }

    function toggleFlag(questionId, displayIdx) {
      if (flaggedQuestions.has(questionId)) {
        flaggedQuestions.delete(questionId);
      } else {
        flaggedQuestions.add(questionId);
      }
      updateFlagUI(questionId, displayIdx);
      updateNavFlagFilter();
    }

    function updateFlagUI(questionId, displayIdx) {
      const isFlagged = flaggedQuestions.has(questionId);
      const flagBtn = document.getElementById('flag-btn-' + displayIdx);
      const svgFilled = '<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M3 21V4m0 0l18-9-6 5 6 5L3 4z"/><' + '/svg>';
      const svgOutline = '<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 21V4m0 0l18-9-6 5 6 5L3 4z"/><' + '/svg>';
      if (flagBtn) {
        flagBtn.dataset.flagged = isFlagged ? '1' : '0';
        flagBtn.title = isFlagged ? 'Bo danh dau' : 'Danh dau xem lai';
        if (isFlagged) {
          flagBtn.className = 'flag-btn px-2 py-1 rounded-lg transition-all bg-amber-100 text-amber-500 flex-shrink-0';
          flagBtn.innerHTML = svgFilled;
        } else {
          flagBtn.className = 'flag-btn px-2 py-1 rounded-lg transition-all bg-gray-100 text-gray-400 hover:bg-amber-50 hover:text-amber-500 flex-shrink-0';
          flagBtn.innerHTML = svgOutline;
        }
      }
      const navBtn = document.getElementById('nav-' + displayIdx);
      if (navBtn) {
        if (isFlagged) navBtn.classList.add('flagged');
        else navBtn.classList.remove('flagged');
      }
    }

    function updateNavFlagFilter() {
      const filterBtn = document.getElementById('flagFilterBtn');
      if (!filterBtn) return;
      const count = flaggedQuestions.size;
      filterBtn.textContent = count > 0 ? `Xem lai (${count})` : 'Xem lai';
      filterBtn.className = `text-xs px-3 py-1.5 rounded-lg font-semibold transition-all ${count > 0 ? 'bg-amber-100 text-amber-700 hover:bg-amber-200' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`;
    }

    let showingFlaggedOnly = false;
    function toggleFlagFilter() {
      showingFlaggedOnly = !showingFlaggedOnly;
      const filterBtn = document.getElementById('flagFilterBtn');
      questionMapping.questionOrder.forEach((qo, idx) => {
        const card = document.getElementById(`q-card-${idx}`);
        if (!card) return;
        if (showingFlaggedOnly && !flaggedQuestions.has(qo.questionId)) {
          card.style.display = 'none';
        } else {
          card.style.display = '';
        }
      });
      if (filterBtn) {
        if (showingFlaggedOnly) {
          filterBtn.classList.add('ring-2', 'ring-amber-400');
        } else {
          filterBtn.classList.remove('ring-2', 'ring-amber-400');
        }
      }
    }

    function startTimer(endTime) {
      updateTimer(endTime);
      timerInterval = setInterval(() => { if (updateTimer(endTime)) submitTest(); }, 1000);
    }

    function updateTimer(endTime) {
      const diff = endTime - new Date();
      const el = document.getElementById('timer');
      if (!el) return false;

      if (diff <= 0) {
        el.textContent = '00:00';
        el.className = 'timer-danger';
        return true;
      }

      const m = Math.floor(diff/60000);
      const s = Math.floor((diff%60000)/1000);
      el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

      if (diff < 60000) {
        el.className = 'timer-danger';
      } else if (diff < 300000) {
        el.className = 'timer-warning';
      } else {
        el.className = 'timer-normal';
      }

      return false;
    }

    window.saveAnswer = async function(questionId) {
      const answers = collectAnswers();
      submissionData.answers = answers;
      updateProgress();

      // Update selected class on all options for this question
      const questionDiv = document.querySelector(`[data-question-id="${questionId}"]`);
      if (questionDiv) {
        questionDiv.querySelectorAll('.option-label').forEach(label => {
          const input = label.querySelector('input');
          if (input) {
            if (input.checked) {
              label.classList.add('selected');
            } else {
              label.classList.remove('selected');
            }
          }
        });
      }

      await supabase.from('submissions').update({ answers, auto_saved: true }).eq('id', submissionId);
    };

    function startAutoSave() {
      autoSaveInterval = setInterval(async () => {
        if (currentScreen !== 'taking') return;
        const answers = collectAnswers();
        await supabase.from('submissions').update({ answers, auto_saved: true }).eq('id', submissionId);
      }, 30000);
    }

    function clearTimers() {
      if (timerInterval) clearInterval(timerInterval);
      if (autoSaveInterval) clearInterval(autoSaveInterval);
      timerInterval = null; autoSaveInterval = null;
    }

    async function submitTest() {
      if (currentScreen !== 'taking') return;

      const answered = countAnswered();
      const total = questionMapping.questionOrder.length;

      // Tạm tắt anti-cheat khi hiện dialog để không bị tính vi phạm oan
      isDialogOpen = true;
      let confirmed;
      if (answered < total) {
        confirmed = confirm(`⚠️ Bạn mới trả lời ${answered}/${total} câu.\n\nBạn có chắc chắn muốn nộp bài?`);
      } else if (flaggedQuestions.size > 0) {
        confirmed = confirm(`🚩 Bạn còn ${flaggedQuestions.size} câu đã đánh dấu xem lại chưa kiểm tra lại.\n\nBạn có chắc chắn muốn nộp bài?`);
      } else {
        confirmed = confirm('✅ Bạn có chắc chắn muốn nộp bài?');
      }
      // Giữ flag thêm 600ms sau khi dialog đóng — trình duyệt vẫn có thể bắn
      // blur/visibilitychange trong khoảng này khi focus trả về trang
      // Đồng thời reset debounce để không có vi phạm tồn đọng từ lúc mở dialog
      if (violationDebounceTimer) clearTimeout(violationDebounceTimer);
      violationDebounceTimer = setTimeout(() => { violationDebounceTimer = null; }, 600);
      setTimeout(() => { isDialogOpen = false; }, 600);
      if (!confirmed) return;

      clearTimers();
      currentScreen = 'submitting';
      deactivateAntiCheat();
      document.getElementById('violationOverlay')?.remove(); // Xóa overlay đỏ nếu còn

      const answers = collectAnswers();

      document.getElementById('mainContent').innerHTML = `
        <div style="text-align:center;padding:80px 0;">
          <div class="spinner" style="margin-bottom:20px;"></div>
          <p style="color:var(--color-ink-charcoal);font-weight:600;font-size:17px;margin-bottom:6px;">Đang chấm bài...</p>
          <p style="color:var(--color-fog-mist);font-size:14px;">Vui lòng đợi trong giây lát</p>
        </div>`;

      try {
        const now = new Date().toISOString();
        await supabase.from('submissions').update({ 
          status: 'submitted', 
          submitted_at: now, 
          answers, 
          auto_saved: false 
        }).eq('id', submissionId);

        const score = await gradeTest(testData, answers, questionMapping);
        const totalPoints = (questionMapping.questionOrder||[]).reduce((sum, q) => sum + (q.points||1), 0);
        await supabase.from('submissions').update({ score, total_points: totalPoints, tab_switch_count: tabSwitchCount }).eq('id', submissionId);
        await showResult(score, answers);
      } catch (e) {
        document.getElementById('mainContent').innerHTML = `
          <div class="glass-card" style="padding:32px;text-align:center;">
            <div style="font-size:48px;margin-bottom:16px;">❌</div>
            <p style="color:#dc2626;font-weight:600;font-size:16px;">Lỗi: ${e.message}</p>
          </div>`;
      }
    }

    async function gradeTest(test, answers, mapping) {
      const qIds = mapping.questionOrder.map(q => q.questionId);
      const { data: qData } = await supabase.from('questions').select('*').in('id', qIds);
      const qMap = {}; (qData||[]).forEach(q => { qMap[q.id] = q; });
      let totalScore = 0;
      mapping.questionOrder.forEach(qo => {
        const q = qMap[qo.questionId];
        if (!q) return;
        const correct = new Set(q.correct_answers || []);
        const selected = new Set((answers.find(a => a.questionId === qo.questionId) || {}).selectedOptions || []);
        if (correct.size === selected.size && [...correct].every(v => selected.has(v))) totalScore += qo.points;
      });
      return totalScore;
    }

    async function showResult(score, submittedAnswers) {
      currentScreen = 'result';
      const totalPoints = (questionMapping.questionOrder||[]).reduce((sum, q) => sum + (q.points||1), 0);
      const qIds = questionMapping.questionOrder.map(q => q.questionId);
      const { data: qData } = await supabase.from('questions').select('*').in('id', qIds);
      const qMap = {}; (qData||[]).forEach(q => { qMap[q.id] = q; });

      let correctCount = 0;
      const totalQuestions = questionMapping.questionOrder.length;
      questionMapping.questionOrder.forEach(qo => {
        const q = qMap[qo.questionId];
        if (!q) return;
        const correct = new Set(q.correct_answers || []);
        const studentAns = (submittedAnswers.find(a => a.questionId === qo.questionId) || {}).selectedOptions || [];
        const selected = new Set(studentAns);
        if (correct.size === selected.size && [...correct].every(v => selected.has(v))) correctCount++;
      });

      const pct = totalPoints > 0 ? Math.round((score/totalPoints)*100) : 0;
      const roundedScore = parseFloat(Math.round(score * 10) / 10);

      const resultHtml = testData.show_answers ? questionMapping.questionOrder.map((qo, idx) => {
        const q = qMap[qo.questionId]; if (!q) return '';
        const studentAns = submittedAnswers.find(a => a.questionId === qo.questionId);
        const selected = studentAns?.selectedOptions || [];
        const correct = q.correct_answers || [];
        const isCorrect = correct.length === selected.length && correct.every(c => selected.includes(c));

        return `<div class="question-card ${isCorrect?'answer-correct':'answer-wrong'} fade-in" style="padding:20px;margin-bottom:12px;">
          <div style="display:flex;gap:12px;margin-bottom:16px;">
            <div class="question-number" style="background:${isCorrect?'#16a34a':'#dc2626'};">${idx+1}</div>
            <div style="flex:1;">
              <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;">
                <p style="font-size:15px;font-weight:600;color:var(--color-ink-charcoal);margin:0;flex:1;">${escapeHtml(q.content||'')}</p>
                <span style="font-size:20px;flex-shrink:0;">${isCorrect?'✅':'❌'}</span>
              </div>
              ${q.image_url ? `<div style="margin-bottom:10px;"><img src="${q.image_url}" alt="Hình minh họa" style="max-width:100%;border-radius:12px;border:1px solid var(--color-mist-border);max-height:280px;object-fit:contain;"></div>` : ''}
              <span style="font-size:12px;color:var(--color-fog-mist);">${qo.points} điểm</span>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;padding-left:46px;">${(q.options||[]).map((opt, oi) => {
            const isSel = selected.includes(oi);
            const isCor = correct.includes(oi);
            let borderColor = 'var(--color-mist-border)';
            let bg = 'var(--color-paper-white)';
            if (isSel && isCor) { borderColor = '#16a34a'; bg = '#dcfce7'; }
            else if (isSel && !isCor) { borderColor = '#dc2626'; bg = '#fee2e2'; }
            else if (!isSel && isCor) { borderColor = '#86efac'; bg = '#f0fdf4'; }

            return `<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:2px solid ${borderColor};background:${bg};">
              <span style="width:24px;height:24px;border-radius:50%;background:${isSel?'var(--color-iris-bolt)':'var(--color-mist-border)'};color:${isSel?'white':'var(--color-slate-veil)'};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;">${String.fromCharCode(65+oi)}</span>
              <span style="flex:1;font-size:14px;font-weight:500;color:var(--color-ink-charcoal);">${escapeHtml(opt)}</span>
              ${isCor && !isSel ? '<span style="font-size:12px;color:#16a34a;font-weight:600;">Đáp án đúng</span>':''}
              ${isSel && !isCor ? '<span style="font-size:12px;color:#dc2626;font-weight:600;">Sai</span>':''}
            </div>`;
          }).join('')}</div>
        </div>`;
      }).join('') : `<div class="glass-card" style="padding:32px;text-align:center;"><p style="color:var(--color-slate-veil);font-size:15px;margin:0;">📝 Giáo viên không hiển thị đáp án chi tiết.</p></div>`;

      document.getElementById('mainContent').innerHTML = `
        <div class="result-card fade-in" style="padding:40px;text-align:center;margin-bottom:24px;">
          <img
            src="result-celebration.svg"
            alt="Học sinh vui mừng nhận kết quả"
            loading="lazy"
            width="180"
            style="display:block;margin:0 auto 20px;height:auto;filter:brightness(1.1);"
          >
          <h2 style="font-size:48px;font-weight:800;margin:0 0 8px;">${roundedScore} / ${totalPoints}</h2>
          <p style="font-size:22px;opacity:0.85;margin:0 0 6px;">Điểm: ${pct}%</p>
          <p style="font-size:16px;opacity:0.75;margin:0 0 16px;">Đúng: <strong>${correctCount}</strong> / ${totalQuestions} câu</p>
          <p style="font-size:17px;font-weight:600;opacity:0.9;margin:0 0 12px;">
            ${pct>=80?'🌟 Xuất sắc! Tiếp tục phát huy!':pct>=60?'👍 Tốt lắm! Cố gắng thêm nhé!':pct>=40?'📚 Cần cố gắng nhiều hơn!':'💪 Đừng nản chí, hãy ôn tập lại nhé!'}
          </p>
          <p style="font-size:13px;opacity:0.65;margin:0;">Học sinh: ${escapeHtml(studentName)}</p>
          ${tabSwitchCount > 0 && strictConfig.track_violations ? `
            <p style="font-size:13px;margin-top:14px;background:rgba(255,255,255,0.15);display:inline-block;padding:6px 16px;border-radius:100px;">
              🚫 Số lần vi phạm: <strong>${tabSwitchCount}</strong>
            </p>` : ''}
        </div>

        ${testData.show_answers ? `
          <div style="margin-bottom:24px;">
            <h3 style="font-size:17px;font-weight:700;color:var(--color-ink-charcoal);margin:0 0 16px;display:flex;align-items:center;gap:8px;">
              📋 Chi tiết bài làm
            </h3>
            ${resultHtml}
          </div>
        ` : ''}

        <div style="text-align:center;padding-bottom:40px;">
          <a href="index.html"
            style="display:inline-flex;align-items:center;gap:10px;background:var(--color-deep-indigo);color:white;padding:14px 32px;border-radius:14px;font-weight:600;font-size:16px;text-decoration:none;">
            ← Về trang chủ
          </a>
        </div>`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ============================================================
    // FEATURE 4: CHỐNG GIAN LẬN (ANTI-CHEAT) - CẤU HÌNH THEO TỪNG TÍNH NĂNG
    // Giáo viên bật/tắt từng phần khi tạo bài kiểm tra (cột strict_mode),
    // học sinh chỉ áp dụng đúng những tính năng giáo viên đã bật.
    // ============================================================
    let tabSwitchCount = 0;
    let antiCheatActive = false;
    let isDialogOpen = false;
    let violationDebounceTimer = null;
    let strictConfig = {
      enabled: false,
      block_tab_switch: true,
      max_violations: 3,
      block_copy_paste: true,
      block_right_click: true,
      block_devtools: true,
      require_fullscreen: false
    };

    function getStrictConfig(test) {
      const sm = (test && test.strict_mode) || {};
      return {
        enabled: !!sm.enabled,
        block_tab_switch: sm.block_tab_switch !== false,
        max_violations: parseInt(sm.max_violations) || 3,
        track_violations: sm.track_violations !== false, // mặc định bật nếu không có giá trị
        block_copy_paste: sm.block_copy_paste !== false,
        block_right_click: sm.block_right_click !== false,
        block_devtools: sm.block_devtools !== false,
        require_fullscreen: !!sm.require_fullscreen
      };
    }

    function buildStrictModeNoticeHTML(test) {
      const sm = getStrictConfig(test);
      if (!sm.enabled) return '';
      const items = [];
      if (sm.block_tab_switch) items.push(`Không chuyển tab / thu nhỏ cửa sổ (tối đa ${sm.max_violations} lần vi phạm)`);
      if (sm.track_violations !== false) items.push('Số lần vi phạm sẽ được ghi lại trong kết quả');
      if (sm.block_copy_paste) items.push('Không sao chép / cắt nội dung');
      if (sm.block_right_click) items.push('Không dùng chuột phải');
      if (sm.block_devtools) items.push('Không mở công cụ lập trình (DevTools)');
      if (sm.require_fullscreen) items.push('Bắt buộc làm bài ở chế độ toàn màn hình');
      if (!items.length) return '';
      return `
        <div class="bg-red-50 border border-red-200 rounded-xl p-4 mb-6 text-left">
          <div class="flex gap-2 items-start">
            <span class="text-red-600 text-lg flex-shrink-0">🛡️</span>
            <div class="text-sm text-gray-700">
              <p class="font-semibold text-red-700 mb-1">Bài thi áp dụng chế độ thi nghiêm túc:</p>
              <ul class="space-y-1 text-xs">
                ${items.map(i => `<li>• ${i}</li>`).join('')}
              </ul>
            </div>
          </div>
        </div>`;
    }

    function activateAntiCheat() {
      strictConfig = getStrictConfig(testData);
      if (!strictConfig.enabled) return; // Giáo viên không bật chế độ nghiêm túc cho bài này

      antiCheatActive = true;
      tabSwitchCount = 0;

      if (strictConfig.block_tab_switch) {
        // Phát hiện chuyển tab / ẩn trang — có cảnh báo và tự nộp bài
        document.addEventListener('visibilitychange', handleVisibilityChange);
        // Phát hiện mất focus cửa sổ
        window.addEventListener('blur', handleWindowBlur);
      } else if (strictConfig.track_violations) {
        // Chỉ ghi nhận vi phạm âm thầm (không cảnh báo, không tự nộp bài)
        document.addEventListener('visibilitychange', handleVisibilityChangeSilent);
        window.addEventListener('blur', handleWindowBlurSilent);
      }
      if (strictConfig.block_copy_paste) {
        // Chặn copy/cut
        document.addEventListener('copy', handleCopyPasteBlock);
        document.addEventListener('cut', handleCopyPasteBlock);
      }
      if (strictConfig.block_right_click) {
        // Chặn chuột phải
        document.addEventListener('contextmenu', handleRightClickBlock);
      }
      if (strictConfig.block_devtools) {
        // Chặn F12, Ctrl+Shift+I, Ctrl+U
        document.addEventListener('keydown', handleKeyDown);
      }
      if (strictConfig.require_fullscreen) {
        requestFullscreenMode();
        document.addEventListener('fullscreenchange', handleFullscreenChange);
      }

      showAntiCheatBanner();
    }

    function deactivateAntiCheat() {
      antiCheatActive = false;
      document.removeEventListener('visibilitychange', handleVisibilityChange);
      document.removeEventListener('visibilitychange', handleVisibilityChangeSilent);
      window.removeEventListener('blur', handleWindowBlur);
      window.removeEventListener('blur', handleWindowBlurSilent);
      document.removeEventListener('copy', handleCopyPasteBlock);
      document.removeEventListener('cut', handleCopyPasteBlock);
      document.removeEventListener('contextmenu', handleRightClickBlock);
      document.removeEventListener('keydown', handleKeyDown);
      document.removeEventListener('fullscreenchange', handleFullscreenChange);
      if (document.fullscreenElement) {
        (document.exitFullscreen ? document.exitFullscreen() : Promise.resolve()).catch(() => {});
      }
      document.getElementById('antiCheatBanner')?.remove();
    }

    function handleCopyPasteBlock(e) {
      if (antiCheatActive && strictConfig.block_copy_paste) e.preventDefault();
    }

    function handleRightClickBlock(e) {
      if (antiCheatActive && strictConfig.block_right_click) e.preventDefault();
    }

    function requestFullscreenMode() {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (req) req.call(el).catch(() => {});
    }

    function handleFullscreenChange() {
      if (!antiCheatActive || currentScreen !== 'taking' || !strictConfig.require_fullscreen) return;
      if (!document.fullscreenElement) {
        tabSwitchCount++;
        showWarning(tabSwitchCount);
      }
    }

    function showAntiCheatBanner() {
      const banner = document.createElement('div');
      banner.id = 'antiCheatBanner';
      banner.style.cssText = `
        position: fixed; bottom: 16px; right: 16px; z-index: 9999;
        background: linear-gradient(135deg, #1e293b, #334155);
        color: white; padding: 8px 14px; border-radius: 10px;
        font-size: 12px; font-weight: 600;
        box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        display: flex; align-items: center; gap: 8px;
        border: 1px solid rgba(255,255,255,0.1);
      `;
      banner.innerHTML = `
        <span style="color:#4ade80">🛡️</span>
        <span>Chế độ nghiêm túc</span>
        ${strictConfig.block_tab_switch ? `<span style="opacity:0.4">·</span><span id="antiCheatBannerCount">Vi phạm: 0/${strictConfig.max_violations}</span>` : ''}
      `;
      document.body.appendChild(banner);
    }

    // Lưu số lần vi phạm vào Supabase — chỉ khi giáo viên bật tính năng ghi nhận vi phạm
    async function saveViolationCount(count) {
      if (!submissionId) return;
      if (!strictConfig.track_violations) return; // Giáo viên tắt ghi nhận vi phạm
      try {
        await supabase.from('submissions').update({ tab_switch_count: count }).eq('id', submissionId);
      } catch (e) {
        console.error('Lỗi lưu số lần vi phạm:', e);
      }
    }

    // Hàm ghi nhận vi phạm dùng chung — debounce 500ms để visibilitychange + blur
    // xảy ra cùng lúc (mở tab mới, chuyển cửa sổ...) chỉ tính 1 lần duy nhất
    function recordViolation(silent = false) {
      if (violationDebounceTimer) return; // Đang trong cửa sổ debounce → bỏ qua
      violationDebounceTimer = setTimeout(() => { violationDebounceTimer = null; }, 800);
      tabSwitchCount++;
      if (silent) {
        saveViolationCount(tabSwitchCount);
      } else {
        showWarning(tabSwitchCount);
      }
    }

    function handleVisibilityChangeSilent() {
      if (!antiCheatActive || currentScreen !== 'taking' || isDialogOpen) return;
      if (document.hidden) recordViolation(true);
    }

    function handleWindowBlurSilent() {
      if (!antiCheatActive || currentScreen !== 'taking' || isDialogOpen) return;
      recordViolation(true);
    }
    // ---- Kết thúc silent listeners ----

    function handleVisibilityChange() {
      if (!antiCheatActive || currentScreen !== 'taking' || !strictConfig.block_tab_switch || isDialogOpen) return;
      if (document.hidden) recordViolation(false);
    }

    function handleWindowBlur() {
      if (!antiCheatActive || currentScreen !== 'taking' || !strictConfig.block_tab_switch || isDialogOpen) return;
      recordViolation(false);
    }

    function handleKeyDown(e) {
      if (!antiCheatActive || !strictConfig.block_devtools) return;
      // F12
      if (e.key === 'F12') { e.preventDefault(); return; }
      // Ctrl+Shift+I (DevTools)
      if (e.ctrlKey && e.shiftKey && e.key === 'I') { e.preventDefault(); return; }
      // Ctrl+U (View source)
      if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return; }
    }

    function showWarning(count) {
      const max = strictConfig.max_violations || 3;
      const remaining = max - count;

      // Lưu số lần vi phạm vào Supabase để giáo viên xem/trừ điểm sau này
      saveViolationCount(count);

      // Cập nhật số đếm hiển thị liên tục trên banner cho học sinh thấy
      const counterEl = document.getElementById('antiCheatBannerCount');
      if (counterEl) counterEl.textContent = `Vi phạm: ${count}/${max}`;
      
      // Remove existing warning if any
      document.getElementById('antiCheatWarning')?.remove();
      
      if (count >= max) {
        // Auto-submit
        const overlay = document.createElement('div');
        overlay.id = 'violationOverlay';
        overlay.style.cssText = `
          position: fixed; inset: 0; z-index: 99999;
          background: rgba(239,68,68,0.95);
          display: flex; align-items: center; justify-content: center;
          flex-direction: column; color: white; text-align: center;
        `;
        overlay.innerHTML = `
          <div style="font-size:64px;margin-bottom:16px">🚫</div>
          <h2 style="font-size:24px;font-weight:800;margin-bottom:8px">Vi phạm quy định thi!</h2>
          <p style="font-size:14px;opacity:0.9;margin-bottom:20px">Bài thi sẽ được nộp tự động do vi phạm quá ${max} lần.</p>
          <div style="font-size:12px;opacity:0.7">Đang nộp bài...</div>
        `;
        document.body.appendChild(overlay);
        setTimeout(() => submitTest(), 2000);
        return;
      }

      const warning = document.createElement('div');
      warning.id = 'antiCheatWarning';
      warning.style.cssText = `
        position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
        z-index: 9999; background: linear-gradient(135deg, #dc2626, #b91c1c);
        color: white; padding: 16px 24px; border-radius: 16px;
        box-shadow: 0 16px 48px rgba(220,38,38,0.4);
        font-weight: 700; text-align: center; animation: slideDown 0.3s ease;
        max-width: 380px; width: 90%;
      `;
      warning.innerHTML = `
        <div style="font-size:24px;margin-bottom:6px">⚠️ Cảnh báo vi phạm!</div>
        <p style="font-size:13px;font-weight:600">Phát hiện vi phạm lần ${count}/${max}</p>
        ${remaining > 0 
          ? `<p style="font-size:12px;opacity:0.9;margin-top:4px">Còn ${remaining} lần trước khi bài thi bị nộp tự động</p>` 
          : ''}
      `;
      document.body.appendChild(warning);
      setTimeout(() => warning.remove(), 4000);

      // Add animation
      const style = document.createElement('style');
      style.textContent = `@keyframes slideDown { from { opacity:0; transform:translateX(-50%) translateY(-20px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }`;
      document.head.appendChild(style);
    }

    init();
  </script>
</body>
</html>
