<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thi trắc nghiệm - TC Kinh tế Kỹ thuật TP Cần Thơ</title>
  <link rel="stylesheet" href="shared.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <style>
    :root {
      --color-iris-bolt: #4255ff;
      --color-ink-charcoal: #282e3e;
      --color-deep-indigo: #2e3856;
      --color-slate-veil: #586380;
      --color-fog-mist: #939bb4;
      --color-chalk-canvas: #f6f7fb;
      --color-paper-white: #ffffff;
      --color-lilac-wash: #edefff;
      --color-mist-border: #d9dde8;
      --color-success: #2f855a;
      --color-success-soft: #e8f7ef;
      --color-danger: #d64545;
      --color-danger-soft: #fff0f0;
      --color-warning: #d97706;
      --color-warning-soft: #fff7e6;
    }

    * {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }

    /* Mobile: ngăn zoom khi tap input trên iOS */
    input, select, textarea, button { -webkit-appearance: none; }
    html { -webkit-overflow-scrolling: touch; }

    /* Safe area cho iPhone notch */
    body {
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      background-color: var(--color-chalk-canvas);
      min-height: 100vh;
      margin: 0;
    }

    /* ===== HEADER ===== */
    header {
      background: var(--color-deep-indigo);
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-inner {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-brand {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-paper-white);
      text-decoration: none;
      letter-spacing: -0.3px;
    }

    .header-brand span { color: #93a8ff; }

    .header-student-info {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
    }

    /* ===== LOADING ===== */
    .spinner {
      border: 3px solid var(--color-mist-border);
      border-top: 3px solid var(--color-iris-bolt);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== CARDS CHUNG ===== */
    .glass-card {
      background: var(--color-paper-white);
      border: 1px solid var(--color-mist-border);
      border-radius: 20px;
    }

    /* ===== TIMER ===== */
    .timer-normal {
      color: var(--color-ink-charcoal);
      background: var(--color-chalk-canvas);
    }
    .timer-warning {
      color: #b45309;
      background: #fffbeb;
      animation: pulse-slow 1.5s ease-in-out infinite;
    }
    .timer-danger {
      color: #b91c1c;
      background: #fff5f5;
      animation: pulse-fast 0.8s ease-in-out infinite;
    }

    @keyframes pulse-slow { 0%,100%{opacity:1} 50%{opacity:0.7} }
    @keyframes pulse-fast { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.85;transform:scale(1.04)} }

    /* ===== PROGRESS BAR ===== */
    .progress-bar {
      background: var(--color-iris-bolt);
      transition: width 0.4s ease;
      border-radius: 999px;
    }

    /* ===== TEST HEADER (sticky trong bài thi) ===== */
    .test-header {
      background: var(--color-paper-white);
      border-bottom: 1px solid var(--color-mist-border);
      position: sticky;
      top: 60px;
      z-index: 30;
    }

    /* ===== QUESTION CARD ===== */
    .question-card {
      background: var(--color-paper-white);
      border: 1px solid var(--color-mist-border);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .question-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--color-iris-bolt);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .question-card.answered {
      border-color: var(--color-iris-bolt);
    }

    .question-card.answered::before {
      opacity: 1;
    }

    .question-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      background: var(--color-deep-indigo);
      color: white;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }

    /* ===== OPTIONS ===== */
    .option-label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border: 2px solid var(--color-mist-border);
      border-radius: 12px;
      background: var(--color-paper-white);
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s;
      min-height: 48px;
      font-size: 15px;
    }

    .option-label:hover {
      border-color: var(--color-iris-bolt);
      background: var(--color-lilac-wash);
    }

    .option-label.selected {
      border-color: var(--color-iris-bolt);
      background: var(--color-lilac-wash);
    }

    .option-checkbox,
    .option-radio {
      width: 22px;
      height: 22px;
      border: 2px solid var(--color-mist-border);
      flex-shrink: 0;
      transition: all 0.18s;
      background: var(--color-paper-white);
    }

    .option-checkbox { border-radius: 6px; }
    .option-radio { border-radius: 50%; }

    input[type="checkbox"]:checked ~ .option-checkbox,
    input[type="radio"]:checked ~ .option-radio {
      background: var(--color-iris-bolt);
      border-color: var(--color-iris-bolt);
    }

    input[type="checkbox"]:checked ~ .option-checkbox::after {
      content: '✓';
      display: block;
      color: white;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      line-height: 18px;
    }

    input[type="radio"]:checked ~ .option-radio::after {
      content: '';
      display: block;
      width: 10px;
      height: 10px;
      background: white;
      border-radius: 50%;
      margin: 4px auto;
    }

    /* ===== SUBMIT BUTTON ===== */
    .btn-submit {
      background: #16a34a;
      color: white;
      font-weight: 600;
      font-size: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.18s, transform 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: #15803d;
      transform: translateY(-1px);
    }

    .btn-submit:active { transform: translateY(0); }

    /* ===== QUESTION NAV ===== */
    .question-nav {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
      gap: 8px;
    }

    .question-nav-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 2px solid var(--color-mist-border);
      background: var(--color-paper-white);
      font-size: 13px;
      font-weight: 600;
      color: var(--color-slate-veil);
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s, transform 0.15s;
    }

    .question-nav-btn:hover {
      border-color: var(--color-iris-bolt);
      transform: scale(1.05);
    }

    .question-nav-btn.answered {
      background: var(--color-iris-bolt);
      color: white;
      border-color: var(--color-iris-bolt);
    }

    .question-nav-btn.flagged {
      background: #fffbeb;
      border-color: #d97706;
      color: #92400e;
    }

    .question-nav-btn.answered.flagged {
      background: var(--color-iris-bolt);
      border: 2px solid #d97706;
      box-shadow: 0 0 0 2px #fef3c7;
      color: white;
    }

    .question-nav-btn.current {
      border-color: var(--color-iris-bolt);
      box-shadow: 0 0 0 3px rgba(66,85,255,0.15);
    }

    /* ===== RESULT CARD ===== */
    .result-card {
      background: var(--color-deep-indigo);
      border-radius: 20px;
      color: white;
      position: relative;
      overflow: hidden;
    }

    /* ===== ANSWER REVIEW ===== */
    .answer-correct {
      border-left: 3px solid #16a34a;
      background: #f0fdf4;
    }

    .answer-wrong {
      border-left: 3px solid #dc2626;
      background: #fff5f5;
    }

    .option-correct {
      background: #dcfce7;
      border-color: #16a34a;
    }

    .option-wrong {
      background: #fee2e2;
      border-color: #dc2626;
    }

    .option-missed {
      background: #f0fdf4;
      border-color: #86efac;
    }

    /* ===== FADE IN ===== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fade-in { animation: fadeInUp 0.4s ease-out; }

    /* ===== MOBILE ===== */
    @media (max-width: 640px) {
      .option-label {
        padding: 13px 14px;
        font-size: 15px;
      }
      .question-card { border-radius: 12px; }
      .test-header { top: 60px; }
    }

    /* ===== EXAM LAYOUT ===== */
     .student-name-screen {
       min-height: 100dvh;
       margin: -20px -28px -80px;
       padding: 1px 28px 80px;
       background-color: var(--color-chalk-canvas);
       background-image: url("student-name-doodle-bg.svg");
       background-position: center;
       background-repeat: no-repeat;
       background-size: cover;
     }
     .quiz-screen {
       min-height: 100dvh;
       margin: -20px -28px -80px;
       padding: 1px 28px 80px;
       background-color: var(--color-chalk-canvas);
       background-image: url("quiz-doodle-bg.svg");
       background-position: center;
       background-repeat: no-repeat;
       background-size: cover;
       background-attachment: fixed;
     }
     .student-name-screen > .glass-card,
     .quiz-screen .exam-shell { position: relative; z-index: 1; background: rgba(255,255,255,.98); }
     .exam-shell {
       width: 100%;
       max-width: 1280px;
       margin: 12px auto 0;
      background: var(--color-paper-white);
      border: 1px solid var(--color-mist-border);
      border-radius: 20px;
      padding: 28px;
    }
     .exam-toolbar {
       display: flex;
       align-items: center;
       justify-content: space-between;
       gap: 28px;
       min-height: 76px;
       padding: 10px 0 18px;
       border-bottom: 1px solid var(--color-mist-border);
     }
     .exam-toolbar h2 { font-size: 18px !important; line-height: 1.35; }
     .exam-timer-label {
       display: flex;
       align-items: center;
       gap: 10px;
       color: var(--color-slate-veil);
       font-size: 15px;
       font-weight: 600;
     }
     .exam-timer-label .btn-icon { width: 22px; height: 22px; }
     #timer { font-size: 24px !important; min-width: 92px; text-align: center; }
    .exam-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 250px;
      gap: 28px;
      padding-top: 24px;
    }
    .question-card {
      padding: 24px !important;
      margin-bottom: 0 !important;
      box-shadow: none !important;
    }
    .question-card p.text-gray-800 {
      font-size: 19px !important;
      line-height: 1.55 !important;
      font-weight: 600 !important;
    }
    .option-label {
      min-height: 54px;
      padding: 14px 16px !important;
    }
    .exam-progress-card {
      height: fit-content;
      position: sticky;
      top: 84px;
      border: 1px solid var(--color-mist-border);
      border-radius: 16px;
      padding: 20px;
      background: var(--color-chalk-canvas);
    }
    .progress-ring {
      width: 132px;
      height: 132px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--color-iris-bolt) var(--progress, 0%), var(--color-mist-border) 0);
      position: relative;
    }
    .progress-ring::after {
      content: '';
      position: absolute;
      inset: 10px;
      background: var(--color-chalk-canvas);
      border-radius: 50%;
    }
    .progress-ring-content { position: relative; z-index: 1; text-align: center; }
    .exam-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--color-mist-border);
    }
    .exam-nav-button {
      min-height: 44px;
      border: 1px solid var(--color-mist-border);
      background: var(--color-paper-white);
      color: var(--color-deep-indigo);
      border-radius: 10px;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .exam-nav-button:hover, .exam-nav-button:focus-visible {
      border-color: var(--color-iris-bolt);
      background: var(--color-lilac-wash);
      outline: none;
    }
    .exam-question-list {
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .exam-question-list .question-nav { display: flex; flex-wrap: wrap; min-width: max-content; }
    .question-nav-btn { flex: 0 0 44px; }
     .flag-btn { min-width: 44px; min-height: 44px; display:inline-flex; align-items:center; justify-content:center; }
     .question-card.question-hidden { display: none !important; }

    .btn-icon { width: 20px; height: 20px; flex: 0 0 auto; pointer-events: none; }

     @media (max-width: 767px) {
       .student-main { padding: 12px 12px 72px !important; }
      .exam-shell { margin: 12px 0 0; padding: 16px; border-radius: 14px; border-left: 0; border-right: 0; }
      .exam-toolbar { gap: 10px; padding-bottom: 14px; }
      .exam-toolbar h2 { max-width: 42vw; }
      .exam-body { display: flex; flex-direction: column; gap: 14px; padding-top: 14px; }
       .exam-progress-card { order: -1; position: static; padding: 14px; }
       .progress-ring { width: 100%; height: 8px; margin: 0 0 14px; border-radius: 999px; background: var(--color-mist-border); }
       .progress-ring::after { display: none; }
       .progress-ring-content { display: flex; align-items: center; justify-content: space-between; width: 100%; padding-top: 2px; }
       .progress-ring-content strong { font-size: 14px !important; }
       .progress-ring-content div { font-size: 12px !important; }
       .exam-toolbar { min-height: 64px; gap: 10px; }
       .exam-toolbar h2 { font-size: 15px !important; }
      .progress-ring[style*="--progress"] { background: linear-gradient(to right, var(--color-iris-bolt) var(--progress, 0%), var(--color-mist-border) var(--progress, 0%)); }
      .question-card p.text-gray-800 { font-size: 17px !important; }
      .question-card { padding: 18px 14px !important; }
      .exam-nav { position: sticky; bottom: 0; background: var(--color-paper-white); margin-left: -14px; margin-right: -14px; padding: 12px 14px; z-index: 10; }
      .exam-nav-button { padding: 0 10px; }
       .exam-final-submit { display: block !important; padding: 24px 0 92px !important; }
       .exam-final-submit .btn-submit { width: 100%; min-height: 52px; }

    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- Header -->
  <header>
    <div class="header-inner">
      <a href="index.html" class="header-brand">Da<span>Quiz</span></a>
      <div id="studentInfo" class="header-student-info" style="display:none"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="student-main" style="width:100%;max-width:none;margin:0;padding:20px 28px 80px;" id="mainContent">

    <!-- Loading State -->
    <div id="loading" style="display:flex;align-items:center;justify-content:center;padding:80px 0;">
      <div style="text-align:center;">
        <div class="daquiz-skeleton" style="width:180px;height:44px;margin:0 auto 16px;border-radius:12px;"></div>
        <div class="daquiz-skeleton" style="width:240px;height:12px;margin:0 auto;"></div>
      </div>
    </div>

    <!-- Error Message -->
    <div id="errorMsg" class="glass-card" style="display:none;padding:40px;text-align:center;">
      <img src="empty-state.svg" alt="Không tìm thấy dữ liệu" style="width:150px;display:block;margin:0 auto 16px;opacity:0.75;">
      <p style="color:#dc2626;font-weight:600;font-size:16px;margin:0 0 16px;"></p>
      <a href="index.html" style="display:inline-flex;align-items:center;gap:8px;background:var(--color-deep-indigo);color:white;padding:12px 24px;border-radius:12px;font-weight:600;text-decoration:none;font-size:14px;">
        ← Về trang chủ
      </a>
    </div>

  </main>

  <script>
    let testCode = null, testData = null, studentName = null;
    let currentScreen = 'name', submissionId = null, submissionData = null;
    let questionMapping = null, timerInterval = null, autoSaveInterval = null;
    let flaggedQuestions = new Set();

    // ========================
    //  HÀM GOM ĐÁP ÁN CHUNG
    // ========================
    function collectAnswers() {
      const answers = [];
      questionMapping.questionOrder.forEach(qo => {
        let selectedOptions = [];
        const checkboxes = document.querySelectorAll(`input[name^="answer_${qo.questionId}_"]:checked`);
        if (checkboxes.length > 0) {
          checkboxes.forEach(inp => selectedOptions.push(parseInt(inp.value)));
        } else {
          const radio = document.querySelector(`input[name="answer_${qo.questionId}"]:checked`);
          if (radio) selectedOptions = [parseInt(radio.value)];
        }
        answers.push({ questionId: qo.questionId, selectedOptions });
      });
      return answers;
    }

    // Đếm số câu đã trả lời
    function countAnswered() {
      let count = 0;
      questionMapping.questionOrder.forEach(qo => {
        const checkboxes = document.querySelectorAll(`input[name^="answer_${qo.questionId}_"]:checked`);
        const radio = document.querySelector(`input[name="answer_${qo.questionId}"]:checked`);
        if (checkboxes.length > 0 || radio) count++;
      });
      return count;
    }

    // Cập nhật thanh tiến trình
    function updateProgress() {
      const total = questionMapping ? questionMapping.questionOrder.length : 0;
      if (total === 0) return;
      const answered = countAnswered();
      const pct = Math.round((answered / total) * 100);
      const bar = document.getElementById('progressBar');
      const text = document.getElementById('progressText');
      if (bar) bar.style.width = pct + '%';
      if (text) text.textContent = `${answered}/${total}`;
      const ring = document.getElementById('progressRing');
      const ringPercent = document.getElementById('progressRingPercent');
      const ringText = document.getElementById('progressTextSide');
      if (ring) ring.style.setProperty('--progress', `${pct}%`);
      if (ringPercent) ringPercent.textContent = `${pct}%`;
      if (ringText) ringText.textContent = `${answered}/${total}`;

      // Update question cards visual state
      questionMapping.questionOrder.forEach((qo, idx) => {
        const card = document.getElementById(`q-card-${idx}`);
        const navBtn = document.getElementById(`nav-${idx}`);
        if (!card) return;

        const checkboxes = document.querySelectorAll(`input[name^="answer_${qo.questionId}_"]:checked`);
        const radio = document.querySelector(`input[name="answer_${qo.questionId}"]:checked`);
        const isAnswered = checkboxes.length > 0 || radio;

        if (isAnswered) {
          card.classList.add('answered');
          if (navBtn) navBtn.classList.add('answered');
        } else {
          card.classList.remove('answered');
          if (navBtn) navBtn.classList.remove('answered');
        }
      });
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      testCode = params.get('code');
      if (!testCode) {
        showCodeInput();
        return;
      }

      // Khi học sinh đóng/reload trang giữa chừng → đánh dấu "đã thoát" để xử lý khi vào lại
      window.addEventListener('beforeunload', () => {
        if (currentScreen !== 'taking' || !submissionId) return;
        // Lưu vào sessionStorage: sẽ được đọc khi học sinh vào lại cùng trình duyệt
        sessionStorage.setItem('exitedSubmission', JSON.stringify({
          submissionId,
          exitViolations: tabSwitchCount + 1 // +1 cho lần thoát này
        }));
      });

      await askName();
    }

    function showCodeInput() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('mainContent').innerHTML = `
        <div class="student-name-screen">
        <div class="glass-card fade-in" style="max-width:440px;margin:48px auto;padding:40px;text-align:center;">
          <img src="student-code.svg" alt="Nhập mã bài kiểm tra" width="210" style="display:block;margin:0 auto 16px;height:auto;">
          <h2 style="font-size:22px;font-weight:700;color:var(--color-ink-charcoal);margin:0 0 8px;">Nhập mã bài kiểm tra</h2>
          <p style="color:var(--color-slate-veil);font-size:14px;margin:0 0 24px;">Mã 4–6 ký tự từ giáo viên</p>
          <input type="text" id="codeInput" placeholder="VD: ABC123"
            style="width:100%;height:52px;border:2px solid var(--color-mist-border);border-radius:12px;padding:0 18px;font-size:20px;font-weight:700;letter-spacing:4px;text-align:center;text-transform:uppercase;color:var(--color-ink-charcoal);outline:none;margin-bottom:12px;"
            maxlength="6" autofocus
            onfocus="this.style.borderColor='var(--color-iris-bolt)'"
            onblur="this.style.borderColor='var(--color-mist-border)'">
          <button onclick="goWithCode()"
            style="width:100%;height:52px;background:var(--color-iris-bolt);color:white;font-size:15px;font-weight:600;border:none;border-radius:12px;cursor:pointer;">
            Vào thi
          </button>
        </div>
        </div>`;
    }

    function goWithCode() {

              <h2 id="resumeTestTitle" style="font-size:20px;font-weight:700;color:var(--color-ink-charcoal);margin:0;">Bạn có bài làm chưa hoàn thành</h2>

            <div style="display:flex;gap:10px;">
              <button type="button" id="restartTestBtn" style="flex:1;min-height:46px;border:1px solid var(--color-mist-border);border-radius:10px;background:var(--color-paper-white);color:var(--color-deep-indigo);font-weight:600;cursor:pointer;">Làm lại</button>
              <button type="button" id="resumeTestBtn" style="flex:1;min-height:46px;border:0;border-radius:10px;background:var(--color-deep-indigo);color:white;font-weight:600;cursor:pointer;">Tiếp tục</button>

    async function startTest() {
      try {
        studentName = document.getElementById('studentNameInput')?.value.trim();
        if (!studentName) return showInlineError('Vui lòng nhập họ và tên.');

        const { data: existingSubs, error: subError } = await supabase.from('submissions')
          .select('*').eq('test_id', testData.id).eq('student_name', studentName)
          .order('attempt_number', { ascending: false });

        if (subError) throw new Error('Lỗi kiểm tra lần làm: ' + subError.message);

        // Kiểm tra xem có submission đang in-progress không
        const inProgressSub = (existingSubs || []).find(s => s.status === 'in-progress');

        if (inProgressSub) {
          // Có bài đang làm dở - hỏi xem muốn tiếp tục hay làm lại
          const continueTest = await showResumeModal(inProgressSub.attempt_number);

          if (continueTest) {
            // Tiếp tục bài làm cũ
            submissionId = inProgressSub.id;
            submissionData = {
              started_at: inProgressSub.started_at,
              answers: inProgressSub.answers || [],
              status: 'in-progress'
            };

            // Load lại question mapping từ submission
            if (inProgressSub.question_order && inProgressSub.option_mappings) {
              questionMapping = {
                questionOrder: inProgressSub.question_order,
                optionMappings: inProgressSub.option_mappings
              };
            } else {
              questionMapping = buildQuestionMapping(testData);
              await supabase.from('submissions').update({
                question_order: questionMapping.questionOrder,
                option_mappings: questionMapping.optionMappings
              }).eq('id', submissionId);
            }

            // Khôi phục số vi phạm cũ từ DB
            tabSwitchCount = inProgressSub.tab_switch_count || 0;

            // Kiểm tra sessionStorage xem có lần thoát trang nào chưa được ghi không
            const exitedData = sessionStorage.getItem('exitedSubmission');
            if (exitedData) {
              try {
                const { submissionId: exitId, exitViolations } = JSON.parse(exitedData);
                if (exitId === submissionId && exitViolations > tabSwitchCount) {
                  tabSwitchCount = exitViolations;
                  // Ghi lên DB ngay
                  await supabase.from('submissions').update({ tab_switch_count: tabSwitchCount }).eq('id', submissionId);
                }
              } catch(e) {}
              sessionStorage.removeItem('exitedSubmission');
            }

            // Tính thời gian kết thúc dựa trên thời gian bắt đầu ban đầu
            const startedAt = new Date(inProgressSub.started_at);
            const endTime = new Date(startedAt.getTime() + testData.duration * 60000);

            // Lấy strict config để kiểm tra vi phạm
            const sm = getStrictConfig(testData);

            // Nếu đã vượt max_violations → tự nộp bài ngay, không cho làm tiếp
            if (sm.enabled && sm.block_tab_switch && tabSwitchCount >= sm.max_violations) {
              currentScreen = 'taking'; // cần set để submitTest chạy được
              submissionData.answers = inProgressSub.answers || [];
              // Render nhanh rồi nộp
              document.getElementById('mainContent').innerHTML = `
                <div style="text-align:center;padding:80px 20px;">
                  <svg aria-hidden="true" style="width:64px;height:64px;color:#dc2626;margin:0 auto 16px;display:block;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg>
                  <p style="color:#dc2626;font-weight:700;font-size:20px;margin:0 0 8px;">Vi phạm quy định thi!</p>
                  <p style="color:var(--color-slate-veil);font-size:14px;margin:0">Bài thi đang được nộp tự động...</p>
                </div>`;
              try {
                const answers = inProgressSub.answers || [];
                const { error: submitError } = await supabase.from('submissions').update({
                  status: 'submitted', submitted_at: new Date().toISOString(), answers,
                  tab_switch_count: tabSwitchCount, auto_saved: false
                }).eq('id', submissionId);
                if (submitError) throw submitError;
                const score = await gradeTest(testData, answers, questionMapping);
                const totalPoints = getTestTotalScore();
                const { error: scoreError } = await supabase.from('submissions').update({ score, total_points: totalPoints }).eq('id', submissionId);
                if (scoreError) throw scoreError;
                await showResult(score, answers);
              } catch (error) {
                showInlineError(`Không thể hoàn tất việc nộp bài: ${error.message}`);
              }
              return;
            }

            currentScreen = 'taking';
            document.getElementById('studentInfo').innerHTML = `
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
              </svg>
              <span>${escapeHtml(studentName)}</span>
            `;
            document.getElementById('studentInfo').style.display = 'flex';
            await renderTestTaking(endTime);
            startAutoSave();
            activateAntiCheat();

            // Hiện cảnh báo nếu đã có vi phạm từ trước
            if (sm.enabled && sm.block_tab_switch && tabSwitchCount > 0) {
              const remaining = sm.max_violations - tabSwitchCount;
              const warn = document.createElement('div');
              warn.style.cssText = `
                position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
                z-index: 9999; background: linear-gradient(135deg, #dc2626, #b91c1c);
                color: white; padding: 16px 24px; border-radius: 16px;
                box-shadow: 0 16px 48px rgba(220,38,38,0.4);
                font-weight: 700; text-align: center; max-width: 380px; width: 90%;
              `;
              warn.innerHTML = `
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
                  <svg aria-hidden="true" style="width:22px;height:22px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                  <span style="font-size:17px;font-weight:700;">Bạn đã thoát khỏi bài thi!</span>
                </div>
                <p style="font-size:13px;font-weight:600;margin:0 0 4px;">Vi phạm hiện tại: ${tabSwitchCount}/${sm.max_violations}</p>
                <p style="font-size:12px;opacity:0.9;margin:0">Còn ${remaining} lần trước khi bài thi bị nộp tự động</p>
              `;
              document.body.appendChild(warn);
              setTimeout(() => warn.remove(), 5000);
            }
            return;
          } else {
            // Xóa bài cũ và tạo bài mới
            await supabase.from('submissions').delete().eq('id', inProgressSub.id);
          }
        }

        // Kiểm tra số lần đã submit
        const submittedCount = (existingSubs || []).filter(s => s.status === 'submitted' || s.status === 'timed-out').length;
        if (submittedCount >= (testData.max_attempts || 1)) {
          return showInlineError('Bạn đã hết lượt làm bài này.');
        }

        // Tạo submission mới
        // Build mapping TRƯỚC để tính total_points chính xác
        questionMapping = buildQuestionMapping(testData);
        const totalPointsForSub = getTestTotalScore();

        const attemptNum = (existingSubs?.[0]?.attempt_number || 0) + 1;
        const now = new Date();
        const { data: newSub, error: insertError } = await supabase.from('submissions').insert({
          test_id: testData.id,
          student_name: studentName,
          attempt_number: attemptNum,
          status: 'in-progress',
          started_at: now.toISOString(),
          answers: [],
          total_points: totalPointsForSub
        }).select().single();

        if (insertError || !newSub) {
          throw new Error('Lỗi tạo phiên làm bài: ' + (insertError?.message || 'Không có dữ liệu trả về'));
        }

        submissionId = newSub.id;
        submissionData = { started_at: now.toISOString(), answers: [], status: 'in-progress' };
        const { error: updateError } = await supabase.from('submissions').update({
          question_order: questionMapping.questionOrder,
          option_mappings: questionMapping.optionMappings
        }).eq('id', submissionId);

        if (updateError) throw new Error('Lỗi cập nhật cấu hình: ' + updateError.message);

        const endTime = new Date(now.getTime() + testData.duration * 60000);
        currentScreen = 'taking';
        document.getElementById('studentInfo').innerHTML = `
          <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
          </svg>
          <span>${escapeHtml(studentName)}</span>
        `;
        document.getElementById('studentInfo').style.display = 'flex';
        await renderTestTaking(endTime);
        startAutoSave();
        activateAntiCheat();
      } catch (e) {
        showInlineError('Không thể bắt đầu bài thi: ' + e.message);
      }
    }

    function buildQuestionMapping(test) {
      const questions = [...(test.questions || [])];
      const questionOrder = [];
      if (test.shuffle_questions) questions.sort(() => Math.random() - 0.5);
      questions.forEach((q, i) => questionOrder.push({ qIndex: i, questionId: q.questionId || q.id }));
      return { questionOrder, optionMappings: {} };
    }

      flaggedQuestions = new Set();
      const main = document.getElementById('mainContent');
      const qIds = questionMapping.questionOrder.map(q => q.questionId);

          </div>
          <div style="display:flex;gap:12px;font-size:12px;color:var(--color-fog-mist);margin-bottom:12px;flex-wrap:wrap;">

        </div>

        <div class="exam-nav">
          <button type="button" class="exam-nav-button" onclick="showQuestion(Math.max(0, activeQuestionIndex - 1))" aria-label="Câu trước">← Câu trước</button>
          <button type="button" class="exam-nav-button" onclick="showQuestion(Math.min(questionMapping.questionOrder.length - 1, activeQuestionIndex + 1))" aria-label="Câu tiếp theo">Câu tiếp theo →</button>

        <!-- Final Submit -->
        <div class="exam-final-submit" style="text-align:center;padding:32px 0 16px;">
          <button onclick="submitTest()" class="btn-submit" style="padding:0 40px;height:52px;font-size:16px;border-radius:14px;">
            <svg class="btn-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h13"/><path d="m13 6 6 6-6 6"/></svg>
            <span>Nộp bài kiểm tra</span>
          </button>

        </div>
        </div>`;

      startTimer(endTime);
      updateProgress();
      showQuestion(0);

      const svgO = '<svg aria-hidden="true" class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4m0 0c4-3 7 3 12 0v9c-5 3-8-3-12 0"/></svg>';
      document.querySelectorAll('.flag-btn').forEach(btn => {
        if (btn.querySelector('svg') === null) btn.innerHTML = svgO;
      });
    }

    let activeQuestionIndex = 0;

    function showQuestion(index) {
      const total = questionMapping?.questionOrder?.length || 0;
      if (!total) return;
      activeQuestionIndex = Math.max(0, Math.min(Number(index) || 0, total - 1));
      for (let idx = 0; idx < total; idx++) {
        const card = document.getElementById(`q-card-${idx}`);
        if (card) card.hidden = idx !== activeQuestionIndex;
        const button = document.getElementById(`nav-${idx}`);
         if (button) button.classList.toggle('current', idx === activeQuestionIndex);
       }
       const activeNav = document.getElementById(`nav-${activeQuestionIndex}`);
       activeNav?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
       const card = document.getElementById(`q-card-${activeQuestionIndex}`);
      if (card) window.scrollTo({ top: card.getBoundingClientRect().top + window.pageYOffset - 180, behavior: 'smooth' });
    }

    function getCurrentQuestionIndex() {
      const cards = [...document.querySelectorAll('[id^="q-card-"]')];
      if (!cards.length) return 0;
      let current = 0;
      let closest = Number.POSITIVE_INFINITY;
      cards.forEach((card, index) => {
        const distance = Math.abs(card.getBoundingClientRect().top - 180);
        if (distance < closest) { closest = distance; current = index; }
      });
      return current;
    }

    function scrollToQuestion(index) {
      const card = document.getElementById(`q-card-${index}`);
      if (card) {
        const headerHeight = 180;
        const cardTop = card.getBoundingClientRect().top + window.pageYOffset - headerHeight;
        window.scrollTo({ top: cardTop, behavior: 'smooth' });

        // Highlight effect
        card.style.boxShadow = '0 0 0 4px rgba(102, 126, 234, 0.3)';
        setTimeout(() => {
          card.style.boxShadow = '';
        }, 1000);
      }
    }

    function toggleFlag(questionId, displayIdx) {
      if (flaggedQuestions.has(questionId)) {
        flaggedQuestions.delete(questionId);
      } else {
        flaggedQuestions.add(questionId);
      }
      updateFlagUI(questionId, displayIdx);
      updateNavFlagFilter();
    }

    function updateFlagUI(questionId, displayIdx) {
      const isFlagged = flaggedQuestions.has(questionId);
      const flagBtn = document.getElementById('flag-btn-' + displayIdx);
      const svgFilled = '<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M5 21V4c4-3 7 3 12 0v9c-5 3-8-3-12 0v8z"/></svg>';
      const svgOutline = '<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 21V4m0 0c4-3 7 3 12 0v9c-5 3-8-3-12 0"/></svg>';
      if (flagBtn) {
        flagBtn.dataset.flagged = isFlagged ? '1' : '0';
           flagBtn.title = isFlagged ? 'Bỏ đánh dấu' : 'Đánh dấu xem lại';
           flagBtn.setAttribute('aria-label', flagBtn.title);
        if (isFlagged) {
          flagBtn.className = 'flag-btn px-2 py-1 rounded-lg transition-all bg-amber-100 text-amber-500 flex-shrink-0';
          flagBtn.innerHTML = svgFilled;
        } else {
          flagBtn.className = 'flag-btn px-2 py-1 rounded-lg transition-all bg-gray-100 text-gray-400 hover:bg-amber-50 hover:text-amber-500 flex-shrink-0';
          flagBtn.innerHTML = svgOutline;
        }
      }
      const navBtn = document.getElementById('nav-' + displayIdx);
      if (navBtn) {
        if (isFlagged) navBtn.classList.add('flagged');
        else navBtn.classList.remove('flagged');
      }
    }

    function updateNavFlagFilter() {
      const filterBtn = document.getElementById('flagFilterBtn');
      if (!filterBtn) return;
      const count = flaggedQuestions.size;
      filterBtn.textContent = count > 0 ? `Xem lai (${count})` : 'Xem lai';
      filterBtn.className = `text-xs px-3 py-1.5 rounded-lg font-semibold transition-all ${count > 0 ? 'bg-amber-100 text-amber-700 hover:bg-amber-200' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`;
    }

    let showingFlaggedOnly = false;
    function toggleFlagFilter() {
      const filterBtn = document.getElementById('flagFilterBtn');
      if (!flaggedQuestions.size) {
        if (filterBtn) filterBtn.textContent = 'Chưa có câu gắn cờ';
        return;
      }
      showingFlaggedOnly = !showingFlaggedOnly;
      if (showingFlaggedOnly) {
        const firstFlaggedIndex = questionMapping.questionOrder.findIndex(qo => flaggedQuestions.has(qo.questionId));
        if (firstFlaggedIndex >= 0) showQuestion(firstFlaggedIndex);
        if (filterBtn) {
          filterBtn.textContent = `Xem lại (${flaggedQuestions.size})`;
          filterBtn.classList.add('ring-2', 'ring-amber-400');
        }
      } else {
        showQuestion(activeQuestionIndex);
        if (filterBtn) {
          filterBtn.textContent = flaggedQuestions.size > 0 ? `Xem lại (${flaggedQuestions.size})` : 'Xem lại';
          filterBtn.classList.remove('ring-2', 'ring-amber-400');
        }
      }
    }

    function startTimer(endTime) {
      updateTimer(endTime);
      timerInterval = setInterval(() => { if (updateTimer(endTime)) submitTest(true); }, 1000);
    }

    function updateTimer(endTime) {
      const diff = endTime - new Date();
      const el = document.getElementById('timer');
      if (!el) return false;

      if (diff <= 0) {
        el.textContent = '00:00';
        el.className = 'timer-danger';
        return true;
      }

      const m = Math.floor(diff/60000);
      const s = Math.floor((diff%60000)/1000);
      el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

      if (diff < 60000) {
        el.className = 'timer-danger';
      } else if (diff < 300000) {
        el.className = 'timer-warning';
      } else {
        el.className = 'timer-normal';
      }

      return false;
    }

    window.saveAnswer = async function(questionId) {
      const answers = collectAnswers();
      submissionData.answers = answers;
      updateProgress();

      // Update selected class on all options for this question
      const questionDiv = document.querySelector(`[data-question-id="${questionId}"]`);
      if (questionDiv) {
        questionDiv.querySelectorAll('.option-label').forEach(label => {
          const input = label.querySelector('input');
          if (input) {
            if (input.checked) {
              label.classList.add('selected');
            } else {
              label.classList.remove('selected');
            }
          }
        });
      }

      await supabase.from('submissions').update({ answers, auto_saved: true }).eq('id', submissionId);
    };

    function startAutoSave() {
      autoSaveInterval = setInterval(async () => {
        if (currentScreen !== 'taking') return;
        const answers = collectAnswers();
        await supabase.from('submissions').update({ answers, auto_saved: true }).eq('id', submissionId);
      }, 30000);
    }

    function clearTimers() {
      if (timerInterval) clearInterval(timerInterval);
      if (autoSaveInterval) clearInterval(autoSaveInterval);
      timerInterval = null; autoSaveInterval = null;
    }

    function showSubmitDialog(answered, total) {
      return new Promise(resolve => {
        const unanswered = total - answered;
        const note = unanswered > 0
          ? `Bạn còn ${unanswered} câu chưa trả lời.`
          : flaggedQuestions.size > 0
            ? `Bạn còn ${flaggedQuestions.size} câu được đánh dấu xem lại.`
            : 'Bạn đã hoàn thành tất cả câu hỏi.';
        const dialog = document.createElement('div');
        dialog.id = 'submitDialog';
        dialog.style.cssText = 'position:fixed;inset:0;z-index:9998;background:rgba(40,46,62,.45);display:flex;align-items:center;justify-content:center;padding:20px;';
        dialog.innerHTML = `
          <div role="dialog" aria-modal="true" aria-labelledby="submitDialogTitle" style="width:100%;max-width:440px;background:var(--color-paper-white);border:1px solid var(--color-mist-border);border-radius:16px;padding:28px;box-shadow:0 16px 40px rgba(40,46,62,.18);">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
              <svg aria-hidden="true" style="width:24px;height:24px;color:var(--color-deep-indigo);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg>
              <h2 id="submitDialogTitle" style="font-size:20px;font-weight:700;color:var(--color-ink-charcoal);margin:0;">Xác nhận nộp bài</h2>
            </div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;">
              <div style="text-align:center;background:var(--color-chalk-canvas);border-radius:10px;padding:12px 6px;"><strong style="display:block;font-size:20px;color:var(--color-ink-charcoal);">${total}</strong><span style="font-size:12px;color:var(--color-slate-veil);">Tổng câu</span></div>
              <div style="text-align:center;background:var(--color-success-soft);border-radius:10px;padding:12px 6px;"><strong style="display:block;font-size:20px;color:var(--color-success);">${answered}</strong><span style="font-size:12px;color:var(--color-slate-veil);">Đã trả lời</span></div>
              <div style="text-align:center;background:${unanswered ? 'var(--color-warning-soft)' : 'var(--color-chalk-canvas)'};border-radius:10px;padding:12px 6px;"><strong style="display:block;font-size:20px;color:${unanswered ? 'var(--color-warning)' : 'var(--color-slate-veil)'};">${unanswered}</strong><span style="font-size:12px;color:var(--color-slate-veil);">Chưa trả lời</span></div>
            </div>
            <p style="font-size:14px;color:var(--color-slate-veil);margin:0 0 22px;">${note}</p>
            <div style="display:flex;gap:10px;justify-content:flex-end;">
              <button type="button" id="cancelSubmitBtn" style="min-height:44px;padding:0 18px;border:1px solid var(--color-mist-border);border-radius:10px;background:var(--color-paper-white);color:var(--color-deep-indigo);font-weight:600;cursor:pointer;">Tiếp tục làm bài</button>
              <button type="button" id="confirmSubmitBtn" style="min-height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--color-deep-indigo);color:white;font-weight:600;cursor:pointer;">Xác nhận nộp bài</button>
            </div>
          </div>`;
        document.body.appendChild(dialog);
        const close = value => { dialog.remove(); resolve(value); };
        dialog.querySelector('#cancelSubmitBtn').onclick = () => close(false);
        dialog.querySelector('#confirmSubmitBtn').onclick = () => close(true);
        dialog.addEventListener('click', event => { if (event.target === dialog) close(false); });
        dialog.querySelector('#confirmSubmitBtn').focus();
      });
    }

    async function submitTest(force = false) {
      if (currentScreen !== 'taking') return;

      const answered = countAnswered();
      const total = questionMapping.questionOrder.length;

      isDialogOpen = true;
      const confirmed = force ? true : await showSubmitDialog(answered, total);
      if (violationDebounceTimer) clearTimeout(violationDebounceTimer);
      violationDebounceTimer = setTimeout(() => { violationDebounceTimer = null; }, 600);
      setTimeout(() => { isDialogOpen = false; }, 600);
      if (!confirmed) return;

      clearTimers();
      currentScreen = 'submitting';
      deactivateAntiCheat();
      document.getElementById('violationOverlay')?.remove(); // Xóa overlay đỏ nếu còn

      const answers = collectAnswers();

      document.getElementById('mainContent').innerHTML = `
        <div style="text-align:center;padding:80px 0;">
          <div class="spinner" style="margin-bottom:20px;"></div>
          <p style="color:var(--color-ink-charcoal);font-weight:600;font-size:17px;margin-bottom:6px;">Đang chấm bài...</p>
          <p style="color:var(--color-fog-mist);font-size:14px;">Vui lòng đợi trong giây lát</p>
        </div>`;

      try {
        const now = new Date().toISOString();
        await supabase.from('submissions').update({ 
          status: 'submitted', 
          submitted_at: now, 
          answers, 
          auto_saved: false 
        }).eq('id', submissionId);

        const score = await gradeTest(testData, answers, questionMapping);
        const totalPoints = getTestTotalScore();
        const { error: scoreError } = await supabase.from('submissions').update({ score, total_points: totalPoints, tab_switch_count: tabSwitchCount }).eq('id', submissionId);
        if (scoreError) throw scoreError;
        await showResult(score, answers);
      } catch (e) {
        document.getElementById('mainContent').innerHTML = `
          <div class="glass-card" style="padding:32px;text-align:center;">
            <svg aria-hidden="true" style="width:48px;height:48px;color:var(--color-danger);margin:0 auto 16px;display:block;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg>
            <p style="color:var(--color-danger);font-weight:600;font-size:16px;">Lỗi: ${e.message}</p>
          </div>`;
      }
    }

    function getTestTotalScore() {
      const value = Number(testData?.total_points ?? testData?.total_score ?? 10);
      return Number.isFinite(value) && value > 0 ? value : 10;
    }

    function roundScore(value) {
      return Math.round((Number(value) + Number.EPSILON) * 2) / 2;
    }

    async function gradeTest(test, answers, mapping) {
      const qIds = mapping.questionOrder.map(q => q.questionId);
      const { data: qData } = await supabase.from('questions').select('*').in('id', qIds);
      const qMap = {}; (qData||[]).forEach(q => { qMap[q.id] = q; });
      let correctCount = 0;
      mapping.questionOrder.forEach(qo => {
        const q = qMap[qo.questionId];
        if (!q) return;
        const correct = new Set(q.correct_answers || []);
        const selected = new Set((answers.find(a => a.questionId === qo.questionId) || {}).selectedOptions || []);
        if (correct.size === selected.size && [...correct].every(v => selected.has(v))) correctCount++;
      });
      return roundScore((correctCount / mapping.questionOrder.length) * getTestTotalScore());
    }

    async function showResult(score, submittedAnswers) {
      currentScreen = 'result';
      const totalPoints = getTestTotalScore();
      const qIds = questionMapping.questionOrder.map(q => q.questionId);
      const { data: qData } = await supabase.from('questions').select('*').in('id', qIds);
      const qMap = {}; (qData||[]).forEach(q => { qMap[q.id] = q; });

      let correctCount = 0;
      const totalQuestions = questionMapping.questionOrder.length;
      questionMapping.questionOrder.forEach(qo => {
        const q = qMap[qo.questionId];
        if (!q) return;
        const correct = new Set(q.correct_answers || []);
        const studentAns = (submittedAnswers.find(a => a.questionId === qo.questionId) || {}).selectedOptions || [];
        const selected = new Set(studentAns);
        if (correct.size === selected.size && [...correct].every(v => selected.has(v))) correctCount++;
      });

      const roundedScore = roundScore(score);
      const pct = totalPoints > 0 ? Math.round((roundedScore / totalPoints) * 100) : 0;

      const resultHtml = testData.show_answers ? questionMapping.questionOrder.map((qo, idx) => {
        const q = qMap[qo.questionId]; if (!q) return '';
        const studentAns = submittedAnswers.find(a => a.questionId === qo.questionId);
        const selected = studentAns?.selectedOptions || [];
        const correct = q.correct_answers || [];
        const isCorrect = correct.length === selected.length && correct.every(c => selected.includes(c));

        return `<div class="question-card ${isCorrect?'answer-correct':'answer-wrong'} fade-in" style="padding:20px;margin-bottom:12px;">
          <div style="display:flex;gap:12px;margin-bottom:16px;">
            <div class="question-number" style="background:${isCorrect?'#16a34a':'#dc2626'};">${idx+1}</div>
            <div style="flex:1;">
              <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;">
                <p style="font-size:15px;font-weight:600;color:var(--color-ink-charcoal);margin:0;flex:1;">${escapeHtml(q.content||'')}</p>
                <span style="display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:${isCorrect?'var(--color-success-soft)':'var(--color-danger-soft)'};color:${isCorrect?'var(--color-success)':'var(--color-danger)'};font-size:0;flex-shrink:0;">
                  <svg aria-hidden="true" style="width:15px;height:15px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">${isCorrect?'<path d="m5 12 4 4L19 6"/>':'<path d="m7 7 10 10M17 7 7 17"/>'}</svg>
                </span>
              </div>
              ${q.image_url ? `<div style="margin-bottom:10px;"><img src="${q.image_url}" alt="Hình minh họa" style="max-width:100%;border-radius:12px;border:1px solid var(--color-mist-border);max-height:280px;object-fit:contain;"></div>` : ''}
               <span style="font-size:12px;color:var(--color-fog-mist);">Câu ${idx + 1}</span>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;padding-left:46px;">${(q.options||[]).map((opt, oi) => {
            const isSel = selected.includes(oi);
            const isCor = correct.includes(oi);
            let borderColor = 'var(--color-mist-border)';
            let bg = 'var(--color-paper-white)';
            if (isSel && isCor) { borderColor = '#16a34a'; bg = '#dcfce7'; }
            else if (isSel && !isCor) { borderColor = '#dc2626'; bg = '#fee2e2'; }
            else if (!isSel && isCor) { borderColor = '#86efac'; bg = '#f0fdf4'; }

            return `<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:2px solid ${borderColor};background:${bg};">
              <span style="width:24px;height:24px;border-radius:50%;background:${isSel?'var(--color-iris-bolt)':'var(--color-mist-border)'};color:${isSel?'white':'var(--color-slate-veil)'};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;">${String.fromCharCode(65+oi)}</span>
              <span style="flex:1;font-size:14px;font-weight:500;color:var(--color-ink-charcoal);">${escapeHtml(opt)}</span>
              ${isCor && !isSel ? '<span style="font-size:12px;color:#16a34a;font-weight:600;">Đáp án đúng</span>':''}
              ${isSel && !isCor ? '<span style="font-size:12px;color:#dc2626;font-weight:600;">Sai</span>':''}
            </div>`;
          }).join('')}</div>
        </div>`;
      }).join('') : `<div class="glass-card" style="padding:32px;text-align:center;"><p style="color:var(--color-slate-veil);font-size:15px;margin:0;">📝 Giáo viên không hiển thị đáp án chi tiết.</p></div>`;

      document.getElementById('mainContent').innerHTML = `
        <div class="result-card fade-in" style="padding:40px;text-align:center;margin-bottom:24px;">
          <img
            src="result-celebration.svg"
            alt="Học sinh vui mừng nhận kết quả"
            loading="lazy"
            width="180"
            style="display:block;margin:0 auto 20px;height:auto;filter:brightness(1.1);"
          >
          <h2 style="font-size:48px;font-weight:800;margin:0 0 8px;">${roundedScore} / ${totalPoints}</h2>
          <p style="font-size:22px;opacity:0.85;margin:0 0 6px;">Điểm: ${pct}%</p>
          <p style="font-size:16px;opacity:0.75;margin:0 0 16px;">Đúng: <strong>${correctCount}</strong> / ${totalQuestions} câu</p>
          <p style="font-size:17px;font-weight:600;opacity:0.9;margin:0 0 12px;">
          ${pct>=80?'Xuất sắc! Tiếp tục phát huy!':pct>=60?'Tốt lắm! Cố gắng thêm nhé!':pct>=40?'Cần cố gắng nhiều hơn!':'Đừng nản chí, hãy ôn tập lại nhé!'}
          </p>
          <p style="font-size:13px;opacity:0.65;margin:0;">Học sinh: ${escapeHtml(studentName)}</p>
          ${tabSwitchCount > 0 && strictConfig.track_violations ? `
            <p style="font-size:13px;margin-top:14px;background:rgba(255,255,255,0.15);display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:100px;">
              <svg aria-hidden="true" style="width:14px;height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg>
              Số lần vi phạm: <strong>${tabSwitchCount}</strong>
            </p>` : ''}
        </div>

        ${testData.show_answers ? `
          <div style="margin-bottom:24px;">
            <h3 style="font-size:17px;font-weight:700;color:var(--color-ink-charcoal);margin:0 0 16px;display:flex;align-items:center;gap:8px;">
              <svg aria-hidden="true" style="width:18px;height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg> Chi tiết bài làm
            </h3>
            ${resultHtml}
          </div>
        ` : ''}

        <div style="text-align:center;padding-bottom:40px;">
          <a href="index.html"
            style="display:inline-flex;align-items:center;gap:10px;background:var(--color-deep-indigo);color:white;padding:14px 32px;border-radius:14px;font-weight:600;font-size:16px;text-decoration:none;">
            <svg class="btn-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg>
            <span>Về trang chủ</span>
          </a>
        </div>`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ============================================================
    // FEATURE 4: CHỐNG GIAN LẬN (ANTI-CHEAT) - CẤU HÌNH THEO TỪNG TÍNH NĂNG
    // Giáo viên bật/tắt từng phần khi tạo bài kiểm tra (cột strict_mode),
    // học sinh chỉ áp dụng đúng những tính năng giáo viên đã bật.
    // ============================================================
    let tabSwitchCount = 0;
    let antiCheatActive = false;
    let isDialogOpen = false;
    let violationDebounceTimer = null;
    let strictConfig = {
      enabled: false,
      block_tab_switch: true,
      max_violations: 3,
      block_copy_paste: true,
      block_right_click: true,
      block_devtools: true,
      require_fullscreen: false
    };

    function getStrictConfig(test) {
      const sm = (test && test.strict_mode) || {};
      return {
        enabled: !!sm.enabled,
        block_tab_switch: sm.block_tab_switch !== false,
        max_violations: parseInt(sm.max_violations) || 3,
        track_violations: sm.track_violations !== false, // mặc định bật nếu không có giá trị
        block_copy_paste: sm.block_copy_paste !== false,
        block_right_click: sm.block_right_click !== false,
        block_devtools: sm.block_devtools !== false,
        require_fullscreen: !!sm.require_fullscreen
      };
    }

    function buildStrictModeNoticeHTML(test) {
      const sm = getStrictConfig(test);
      if (!sm.enabled) return '';
      const items = [];
      if (sm.block_tab_switch) items.push(`Không chuyển tab / thu nhỏ cửa sổ (tối đa ${sm.max_violations} lần vi phạm)`);
      if (sm.track_violations !== false) items.push('Số lần vi phạm sẽ được ghi lại trong kết quả');
      if (sm.block_copy_paste) items.push('Không sao chép / cắt nội dung');
      if (sm.block_right_click) items.push('Không dùng chuột phải');
      if (sm.block_devtools) items.push('Không mở công cụ lập trình (DevTools)');
      if (sm.require_fullscreen) items.push('Bắt buộc làm bài ở chế độ toàn màn hình');
      if (!items.length) return '';
      return `
        <div class="bg-red-50 border border-red-200 rounded-xl p-4 mb-6 text-left">
          <div class="flex gap-2 items-start">
            <svg aria-hidden="true" style="width:22px;height:22px;color:var(--color-warning);flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 20 6v5c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10V6l8-3Z"/><path d="m9 12 2 2 4-4"/></svg>
            <div class="text-sm text-gray-700">
              <p class="font-semibold text-red-700 mb-1">Bài thi áp dụng chế độ thi nghiêm túc:</p>
              <ul class="space-y-1 text-xs">
                ${items.map(i => `<li>• ${i}</li>`).join('')}
              </ul>
            </div>
          </div>
        </div>`;
    }

    function activateAntiCheat() {
      strictConfig = getStrictConfig(testData);
      if (!strictConfig.enabled) return; // Giáo viên không bật chế độ nghiêm túc cho bài này

      antiCheatActive = true;
      tabSwitchCount = 0;

      if (strictConfig.block_tab_switch) {
        // Phát hiện chuyển tab / ẩn trang — có cảnh báo và tự nộp bài
        document.addEventListener('visibilitychange', handleVisibilityChange);
        // Phát hiện mất focus cửa sổ
        window.addEventListener('blur', handleWindowBlur);
      } else if (strictConfig.track_violations) {
        // Chỉ ghi nhận vi phạm âm thầm (không cảnh báo, không tự nộp bài)
        document.addEventListener('visibilitychange', handleVisibilityChangeSilent);
        window.addEventListener('blur', handleWindowBlurSilent);
      }
      if (strictConfig.block_copy_paste) {
        // Chặn copy/cut
        document.addEventListener('copy', handleCopyPasteBlock);
        document.addEventListener('cut', handleCopyPasteBlock);
      }
      if (strictConfig.block_right_click) {
        // Chặn chuột phải
        document.addEventListener('contextmenu', handleRightClickBlock);
      }
      if (strictConfig.block_devtools) {
        // Chặn F12, Ctrl+Shift+I, Ctrl+U
        document.addEventListener('keydown', handleKeyDown);
      }
      if (strictConfig.require_fullscreen) {
        requestFullscreenMode();
        document.addEventListener('fullscreenchange', handleFullscreenChange);
      }

      showAntiCheatBanner();
    }

    function deactivateAntiCheat() {
      antiCheatActive = false;
      document.removeEventListener('visibilitychange', handleVisibilityChange);
      document.removeEventListener('visibilitychange', handleVisibilityChangeSilent);
      window.removeEventListener('blur', handleWindowBlur);
      window.removeEventListener('blur', handleWindowBlurSilent);
      document.removeEventListener('copy', handleCopyPasteBlock);
      document.removeEventListener('cut', handleCopyPasteBlock);
      document.removeEventListener('contextmenu', handleRightClickBlock);
      document.removeEventListener('keydown', handleKeyDown);
      document.removeEventListener('fullscreenchange', handleFullscreenChange);
      if (document.fullscreenElement) {
        (document.exitFullscreen ? document.exitFullscreen() : Promise.resolve()).catch(() => {});
      }
      document.getElementById('antiCheatBanner')?.remove();
    }

    function handleCopyPasteBlock(e) {
      if (antiCheatActive && strictConfig.block_copy_paste) e.preventDefault();
    }

    function handleRightClickBlock(e) {
      if (antiCheatActive && strictConfig.block_right_click) e.preventDefault();
    }

    function requestFullscreenMode() {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (req) req.call(el).catch(() => {});
    }

    function handleFullscreenChange() {
      if (!antiCheatActive || currentScreen !== 'taking' || !strictConfig.require_fullscreen) return;
      if (!document.fullscreenElement) {
        tabSwitchCount++;
        showWarning(tabSwitchCount);
      }
    }

    function showAntiCheatBanner() {
      const banner = document.createElement('div');
      banner.id = 'antiCheatBanner';
      banner.style.cssText = `
        position: fixed; bottom: 16px; right: 16px; z-index: 9999;
        background: linear-gradient(135deg, #1e293b, #334155);
        color: white; padding: 8px 14px; border-radius: 10px;
        font-size: 12px; font-weight: 600;
        box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        display: flex; align-items: center; gap: 8px;
        border: 1px solid rgba(255,255,255,0.1);
      `;
      banner.innerHTML = `
        <svg aria-hidden="true" style="width:18px;height:18px;color:#86efac;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 20 6v5c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10V6l8-3Z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>Chế độ nghiêm túc</span>
        ${strictConfig.block_tab_switch ? `<span style="opacity:0.4">·</span><span id="antiCheatBannerCount">Vi phạm: 0/${strictConfig.max_violations}</span>` : ''}
      `;
      document.body.appendChild(banner);
    }

    // Lưu số lần vi phạm vào Supabase — chỉ khi giáo viên bật tính năng ghi nhận vi phạm
    async function saveViolationCount(count) {
      if (!submissionId) return;
      if (!strictConfig.track_violations) return; // Giáo viên tắt ghi nhận vi phạm
      try {
        await supabase.from('submissions').update({ tab_switch_count: count }).eq('id', submissionId);
      } catch (e) {
        console.error('Lỗi lưu số lần vi phạm:', e);
      }
    }

    // Hàm ghi nhận vi phạm dùng chung — debounce 500ms để visibilitychange + blur
    // xảy ra cùng lúc (mở tab mới, chuyển cửa sổ...) chỉ tính 1 lần duy nhất
    function recordViolation(silent = false) {
      if (violationDebounceTimer) return; // Đang trong cửa sổ debounce → bỏ qua
      violationDebounceTimer = setTimeout(() => { violationDebounceTimer = null; }, 800);
      tabSwitchCount++;
      if (silent) {
        saveViolationCount(tabSwitchCount);
      } else {
        showWarning(tabSwitchCount);
      }
    }

    function handleVisibilityChangeSilent() {
      if (!antiCheatActive || currentScreen !== 'taking' || isDialogOpen) return;
      if (document.hidden) recordViolation(true);
    }

    function handleWindowBlurSilent() {
      if (!antiCheatActive || currentScreen !== 'taking' || isDialogOpen) return;
      recordViolation(true);
    }
    // ---- Kết thúc silent listeners ----

    function handleVisibilityChange() {
      if (!antiCheatActive || currentScreen !== 'taking' || !strictConfig.block_tab_switch || isDialogOpen) return;
      if (document.hidden) recordViolation(false);
    }

    function handleWindowBlur() {
      if (!antiCheatActive || currentScreen !== 'taking' || !strictConfig.block_tab_switch || isDialogOpen) return;
      recordViolation(false);
    }

    function handleKeyDown(e) {
      if (!antiCheatActive || !strictConfig.block_devtools) return;
      // F12
      if (e.key === 'F12') { e.preventDefault(); return; }
      // Ctrl+Shift+I (DevTools)
      if (e.ctrlKey && e.shiftKey && e.key === 'I') { e.preventDefault(); return; }
      // Ctrl+U (View source)
      if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return; }
    }

    function showWarning(count) {
      const max = strictConfig.max_violations || 3;
      const remaining = max - count;

      // Lưu số lần vi phạm vào Supabase để giáo viên xem/trừ điểm sau này
      saveViolationCount(count);

      // Cập nhật số đếm hiển thị liên tục trên banner cho học sinh thấy
      const counterEl = document.getElementById('antiCheatBannerCount');
      if (counterEl) counterEl.textContent = `Vi phạm: ${count}/${max}`;
      
      // Remove existing warning if any
      document.getElementById('antiCheatWarning')?.remove();
      
      if (count >= max) {
        // Auto-submit
        const overlay = document.createElement('div');
        overlay.id = 'violationOverlay';
        overlay.style.cssText = `
          position: fixed; inset: 0; z-index: 99999;
          background: rgba(239,68,68,0.95);
          display: flex; align-items: center; justify-content: center;
          flex-direction: column; color: white; text-align: center;
        `;
        overlay.innerHTML = `
          <svg aria-hidden="true" style="width:64px;height:64px;color:white;margin-bottom:16px;opacity:0.9;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg>
          <h2 style="font-size:24px;font-weight:800;margin-bottom:8px">Vi phạm quy định thi!</h2>
          <p style="font-size:14px;opacity:0.9;margin-bottom:20px">Bài thi sẽ được nộp tự động do vi phạm quá ${max} lần.</p>
          <div style="font-size:12px;opacity:0.7">Đang nộp bài...</div>
        `;
        document.body.appendChild(overlay);
        setTimeout(() => submitTest(true), 2000);
        return;
      }

      const warning = document.createElement('div');
      warning.id = 'antiCheatWarning';
      warning.style.cssText = `
        position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
        z-index: 9999; background: linear-gradient(135deg, #dc2626, #b91c1c);
        color: white; padding: 16px 24px; border-radius: 16px;
        box-shadow: 0 16px 48px rgba(220,38,38,0.4);
        font-weight: 700; text-align: center; animation: slideDown 0.3s ease;
        max-width: 380px; width: 90%;
      `;
      warning.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
          <svg aria-hidden="true" style="width:22px;height:22px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span style="font-size:16px;font-weight:700;">Cảnh báo vi phạm!</span>
        </div>
        <p style="font-size:13px;font-weight:600;margin:0 0 4px;">Phát hiện vi phạm lần ${count}/${max}</p>
        ${remaining > 0 
          ? `<p style="font-size:12px;opacity:0.9;margin:0">Còn ${remaining} lần trước khi bài thi bị nộp tự động</p>` 
          : ''}\n      `;
      document.body.appendChild(warning);
      setTimeout(() => warning.remove(), 4000);

      // Add animation
      const style = document.createElement('style');
      style.textContent = `@keyframes slideDown { from { opacity:0; transform:translateX(-50%) translateY(-20px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }`;
      document.head.appendChild(style);
    }

    init();
  </script>
</body>
</html>
